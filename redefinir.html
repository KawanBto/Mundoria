<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Redefinir Senha - Mundoria</title>
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f67123;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card-redefinir {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .btn-azul {
            background: #00008b;
            color: white;
            width: 100%;
            font-weight: bold;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }

        .btn-azul:hover {
            background: #00005c;
        }
    </style>
</head>

<body>
    <div class="card-redefinir">
        <h2 class="mb-3 text-center fw-bold" style="color: #f67123;">RECUPERAR SENHA</h2>
        <p class="text-muted text-center small mb-4">Insira seu e-mail abaixo para receber o link de redefinição.</p>

        <form id="form-redefinir">
            <div class="mb-3">
                <label class="form-label fw-bold">E-mail cadastrado</label>
                <input type="email" id="email-redefinir" class="form-control" placeholder="seu@email.com" required>
            </div>
            <button type="submit" class="btn btn-azul mb-3">ENVIAR LINK</button>
        </form>

        <div class="text-center">
            <a href="login.html" class="small text-muted text-decoration-none">Voltar para o <b>Login</b></a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

        // Configuração do Mundoria [cite: 67]
        import { firebaseConfig } from './config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('form-redefinir').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email-redefinir').value;

            try {
                // Envia o e-mail de recuperação via Firebase Auth [cite: 81]
                await sendPasswordResetEmail(auth, email);

                alert("Sucesso! Verifique sua caixa de entrada para redefinir a senha.");

                // Redireciona de volta para o login após o sucesso
                window.location.href = "login.html";
            } catch (error) {
                console.error("Erro ao resetar:", error);
                alert("Erro: Verifique se o e-mail está correto.");
            }
        });
    </script>
</body>

</html>
