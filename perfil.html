<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Perfil - Mundoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f8f9fa; }
        .card-perfil { max-width: 700px; margin: 50px auto; border-radius: 15px; overflow: hidden; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header-perfil { background: #2c3e50; padding: 30px; text-align: center; color: white; }
        .foto-preview { width: 140px; height: 140px; border-radius: 50%; border: 4px solid white; object-fit: cover; background: #eee; }
        .btn-salvar { background-color: #f67123; color: white; border: none; }
        .btn-salvar:hover { background-color: #d95e16; color: white; }
        .img-container { max-height: 500px; display: block; } .img-container img { max-width: 100%; }
    </style>
</head>
<body>

    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/" style="color: #f67123;">🌍 Mundoria</a>
            <a href="/" class="btn btn-outline-secondary btn-sm">Voltar para Home</a>
        </div>
    </nav>

    <div class="card card-perfil">
        <div class="header-perfil">
            <img id="img-preview" src="" class="foto-preview mb-3">
            <h3 id="titulo-nome">Carregando...</h3>
            <label class="btn btn-sm btn-light mt-2" style="cursor: pointer;">
                📷 Alterar Foto
                <input type="file" id="input-arquivo" accept="image/*" onchange="abrirRecorte(event)" hidden>
            </label>
        </div>

        <div class="card-body p-4">
            <form id="form-perfil">
                <div class="row mb-3">
                    <div class="col-md-6"><label class="form-label fw-bold">Nome</label><input type="text" name="nome" id="input-nome" class="form-control" required></div>
                    <div class="col-md-6"><label class="form-label fw-bold">E-mail</label><input type="email" name="email" id="input-email" class="form-control" required></div>
                </div>
                <hr class="my-4">
                <h5 class="mb-3 text-muted">📍 Endereço</h5>
                <div class="mb-3"><label class="form-label">Endereço</label><input type="text" name="endereco" id="input-endereco" class="form-control" placeholder="Rua, Número"></div>
                <div class="row mb-4">
                    <div class="col-md-8"><label class="form-label">Cidade</label><input type="text" name="cidade" id="input-cidade" class="form-control"></div>
                    <div class="col-md-4"><label class="form-label">Estado</label><select name="estado" id="input-estado" class="form-select"><option value="">...</option><option value="SP">SP</option><option value="RJ">RJ</option><option value="MG">MG</option></select></div>
                </div>
                <div class="d-grid"><button type="submit" class="btn btn-salvar btn-lg">Salvar Alterações</button></div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="modalRecorte" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Ajuste sua Foto</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="img-container"><img id="imagem-para-cortar" src=""></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-primary" onclick="confirmarRecorte()">Cortar e Usar</button></div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script>
        let cropper, arquivoCortado = null;

        fetch('/api/usuario-atual').then(res => res.json()).then(user => {
            if(user.logado) {
                document.getElementById('input-nome').value = user.nome;
                document.getElementById('titulo-nome').innerText = user.nome;
                document.getElementById('input-email').value = user.email;
                document.getElementById('img-preview').src = user.foto;
                document.getElementById('input-endereco').value = user.endereco || '';
                document.getElementById('input-cidade').value = user.cidade || '';
                document.getElementById('input-estado').value = user.estado || '';
            } else window.location.href = '/login';
        });

        function abrirRecorte(event) {
            const files = event.target.files;
            if (files && files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagem-para-cortar').src = e.target.result;
                    const modal = new bootstrap.Modal(document.getElementById('modalRecorte'));
                    modal.show();
                    if (cropper) cropper.destroy();
                    setTimeout(() => { cropper = new Cropper(document.getElementById('imagem-para-cortar'), { aspectRatio: 1, viewMode: 1 }); }, 200);
                };
                reader.readAsDataURL(files[0]);
            }
            event.target.value = ''; 
        }

        function confirmarRecorte() {
            if (!cropper) return;
            cropper.getCroppedCanvas({ width: 300, height: 300 }).toBlob((blob) => {
                arquivoCortado = blob;
                document.getElementById('img-preview').src = URL.createObjectURL(blob);
                bootstrap.Modal.getInstance(document.getElementById('modalRecorte')).hide();
            });
        }

        document.getElementById('form-perfil').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            if (arquivoCortado) formData.append('nova_foto', arquivoCortado, 'foto.jpg');

            fetch('/api/editar-perfil', { method: 'POST', body: formData })
            .then(res => res.text())
            .then(html => { document.body.innerHTML += html; })
            .catch(err => alert('Erro ao salvar.'));
        });
    </script>
</body>
</html>
