<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Área do Produtor - Mundoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { background: #343a40; min-height: 100vh; color: white; padding: 20px; }
        .form-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="d-flex">
        <div class="sidebar col-md-3 col-lg-2 d-none d-md-block">
            <h4>⚙️ Gestão</h4>
            <hr>
            <ul class="nav flex-column">
                <li class="nav-item mb-2"><a href="/" class="text-white text-decoration-none">🏠 Voltar ao Site</a></li>
                <li class="nav-item"><a href="#" class="text-warning text-decoration-none">📅 Meus Eventos</a></li>
            </ul>
        </div>

        <div class="col-md-9 col-lg-10 p-4">
            <h2 class="mb-4">Painel do Produtor</h2>

            <div class="row">
                <div class="col-md-8">
                    <div class="form-box">
                        <h4 class="mb-3">Cadastrar Novo Evento</h4>
                        <form action="/cadastrar-evento" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Nome do Evento</label>
                                <input type="text" class="form-control" name="nome_evento" required>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Data</label>
                                    <input type="date" class="form-control" name="data" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Local (Ponto de Interesse)</label>
                                    <input type="text" class="form-control" name="local" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descrição / Atrações</label>
                                <textarea class="form-control" name="descricao" rows="3"></textarea>
                            </div>

                            <button type="submit" class="btn btn-success w-100">🚀 Publicar Evento</button>
                        </form>
                    </div>
                </div>
                
                <div class="col-md-4">
                    <div class="card bg-primary text-white p-3 mb-3">
                        <h5>Dica para o Produtor</h5>
                        <p class="small mb-0">Eventos com descrições detalhadas atraem 40% mais turistas!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
