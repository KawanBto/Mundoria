<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Detalhes - Mundoria</title>
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --laranja-mundoria: #f67123;
            --azul-abas: #00008b;
        }

        body {
            background: #f8f9fa;
            font-family: sans-serif;
        }

        .navbar {
            background: #fff;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .btn-laranja {
            background: #f67123;
            color: white;
            border: none;
        }

        .detalhe-header {
            background: #f67123;
            padding: 30px;
            border-radius: 0 0 20px 20px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .box-info {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            height: fit-content;
            border-left: 5px solid #00008b;
        }

        .box-avaliacao {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            height: fit-content;
        }

        .img-local {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 15px;
            border: 1px solid #eee;
        }

        .btn-favoritar {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            transition: 0.2s;
        }

        .btn-favoritar:hover {
            transform: scale(1.1);
        }

        .coracao-ativo {
            color: #ff4040 !important;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .comentario-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .comentario-texto,
        #end-local,
        #desc-local {
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: normal;
            /* Volta ao normal para não bugar o alinhamento */
            white-space: pre-wrap;
            max-width: 100% !important;
            display: inline-block;
            /* Garante que ocupe apenas o espaço necessário */
            color: #555;
            line-height: 1.6;
        }

        .resposta-dono {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            border-left: 3px solid #f67123;
            font-size: 0.9em;
            margin-left: 20px;
        }

        .estrela {
            color: #ccc;
            cursor: pointer;
            font-size: 1.5rem;
            transition: 0.2s;
        }

        .estrela.ativa {
            color: #f67123;
        }

        #mapa-detalhe {
            height: 250px;
            width: 100%;
            border-radius: 10px;
            margin-top: 15px;
            border: 1px solid #ccc;
            z-index: 1;
        }

        .badge-cat {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .d-none {
            display: none !important;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html" style="color: #f67123;">🌍 Mundoria</a>
            <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Voltar</a>
        </div>
    </nav>

    <div class="detalhe-header">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <h1 id="nome-local" class="fw-bold m-0 display-5">Carregando...</h1>
                <button class="btn-favoritar" id="btn-coracao" onclick="toggleFavorito()" title="Favoritar">
                    <i class="bi bi-heart" id="icone-coracao"></i>
                </button>
            </div>
            <span class="badge-cat fs-6" id="categoria-local">-</span>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row">
            <div class="col-lg-7 mb-4">
                <img id="img-local" src="" class="img-local mb-4 shadow-sm">
                <div class="box-info">
                    <h4 class="fw-bold text-primary mb-3"><i class="bi bi-info-circle"></i> Sobre o Local</h4>
                    <p class="mb-2">
                        <strong>📍 Endereço:</strong>
                        <span id="end-local" class="text-break"
                            style="display: inline-block; max-width: 100%;">...</span>
                    </p>
                    <p id="linha-data" class="mb-2 d-none"><strong>📅 Data do Evento:</strong> <span
                            id="data-local"></span></p>
                    <p id="linha-dias" class="mb-2 d-none"><strong><i class="bi bi-calendar-check text-primary"></i>
                            Dias:</strong> <span id="det-dias">...</span></p>
                    <p id="linha-hora" class="mb-2 d-none"><strong>⏰ Horário:</strong> <span id="hora-local"></span></p>
                    <hr>
                    <p id="desc-local" style="white-space: pre-wrap; line-height: 1.6;">...</p>
                    <h5 class="fw-bold mt-4 mb-3"><i class="bi bi-map"></i> Localização</h5>
                    <div id="mapa-detalhe"></div>
                    <a id="btn-rota" href="#" target="_blank" class="btn btn-success w-100 mt-3 fw-bold p-2 shadow-sm">
                        <i class="bi bi-cursor-fill"></i> Abrir no GPS
                    </a>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="box-avaliacao">
                    <h4 class="fw-bold text-primary mb-3"><i class="bi bi-star"></i> Avaliações</h4>
                    <div id="area-avaliacao">
                        <div class="card bg-light border-0 p-4 mb-4 shadow-sm" id="form-avaliacao-card"
                            style="display: none;">
                            <label class="fw-bold mb-2 text-dark">Sua experiência:</label>
                            <div class="mb-3 text-center" id="estrelas-container">
                                <i class="bi bi-star-fill estrela" data-nota="1" onclick="setNota(1)"></i>
                                <i class="bi bi-star-fill estrela" data-nota="2" onclick="setNota(2)"></i>
                                <i class="bi bi-star-fill estrela" data-nota="3" onclick="setNota(3)"></i>
                                <i class="bi bi-star-fill estrela" data-nota="4" onclick="setNota(4)"></i>
                                <i class="bi bi-star-fill estrela" data-nota="5" onclick="setNota(5)"></i>
                            </div>
                            <textarea id="texto-comentario" class="form-control mb-2" rows="3" maxlength="250"
                                oninput="contarCaracteres(this)" placeholder="Conte o que achou..."></textarea>
                            <div class="text-end mb-3"><small id="contador-chars" class="text-muted">0 / 250</small>
                            </div>
                            <button class="btn btn-laranja w-100 fw-bold" onclick="enviarAvaliacao()">ENVIAR
                                AVALIAÇÃO</button>
                        </div>
                    </div>
                    <div id="aviso-login" class="alert alert-info d-none text-center p-3 shadow-sm"><i
                            class="bi bi-lock-fill fs-4"></i><br><strong>Faça login</strong> para avaliar.<br><a
                            href="login.html" class="btn btn-primary btn-sm mt-2">Entrar</a></div>
                    <div id="aviso-parceiro" class="alert alert-warning d-none text-center p-3 shadow-sm"><i
                            class="bi bi-info-circle-fill fs-5"></i><br>Parceiros não avaliam.</div>
                    <h5 class="text-muted border-bottom pb-2 mb-3">Comentários Recentes</h5>
                    <div id="lista-comentarios" style="max-height: 500px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, addDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

        import { firebaseConfig } from './config.js';
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.dbFirebase = db; window.docFirebase = doc; window.getDocFirebase = getDoc; window.collectionFirebase = collection; window.queryFirebase = query; window.whereFirebase = where; window.getDocsFirebase = getDocs; window.addDocFirebase = addDoc; window.setDocFirebase = setDoc; window.deleteDocFirebase = deleteDoc;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userSnap = await getDoc(doc(db, "users", user.email.toLowerCase()));
                const userData = userSnap.exists() ? userSnap.data() : null;
                if (userData) {
                    window.usuarioAtual = { id: user.email.toLowerCase(), ...userData, logado: true };
                    verificarStatusFavorito(user.email.toLowerCase());
                    if (userData.tipo === 'parceiro') { document.getElementById('form-avaliacao-card').style.display = 'none'; document.getElementById('aviso-parceiro').classList.remove('d-none'); }
                    else { document.getElementById('form-avaliacao-card').style.display = 'block'; document.getElementById('aviso-login').classList.add('d-none'); }
                }
            } else {
                window.usuarioAtual = { logado: false };
                document.getElementById('form-avaliacao-card').style.display = 'none';
                document.getElementById('aviso-login').classList.remove('d-none');
            }
        });

        // Chamada imediata para evitar lentidão do setTimeout
        carregarDetalhesFirebase();
    </script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const idLocal = params.get('id');
        let notaSelecionada = 0; let mapaDetalhe = null; let isFavoritoAtivo = false;

        async function carregarDetalhesFirebase() {
            try {
                const snap = await window.getDocFirebase(window.docFirebase(window.dbFirebase, "locais", idLocal));
                if (!snap.exists()) { window.location.href = "index.html"; return; }
                const local = snap.data();

                document.getElementById('nome-local').innerText = local.nome;
                document.getElementById('categoria-local').innerText = local.categoria;
                document.getElementById('img-local').src = local.imagem;
                // CORREÇÃO: Trata o endereço se for Objeto ou String (para manter compatibilidade)
                let enderecoTexto = "";
                if (typeof local.endereco === 'object' && local.endereco !== null) {
                    // Se for o novo formato (Objeto), monta a string formatada
                    const e = local.endereco;
                    enderecoTexto = `${e.rua || ''}${e.cidade ? ', ' + e.cidade : ''}${e.cep ? ' - CEP: ' + e.cep : ''}`;
                } else {
                    // Se for o formato antigo (String), usa como está
                    enderecoTexto = local.endereco || "Endereço não informado";
                }

                document.getElementById('end-local').innerText = `${enderecoTexto}, ${local.numero || 'S/N'}`;
                document.getElementById('desc-local').innerText = local.descricao;

                if (local.dias_semana) {
                    document.getElementById('linha-dias').classList.remove('d-none');
                    const textoDias = Array.isArray(local.dias_semana) ? local.dias_semana.join(", ") : local.dias_semana;
                    document.getElementById('det-dias').innerText = textoDias;
                }

                if (local.horario) {
                    document.getElementById('linha-hora').classList.remove('d-none');
                    const spanHora = document.getElementById('hora-local');
                    spanHora.innerHTML = local.horario === "Livre" ? `<span class="badge bg-success">Aberto 24h</span>` : local.horario;
                }

                if (local.lat && local.lon) {
                    if (!mapaDetalhe) {
                        mapaDetalhe = L.map('mapa-detalhe').setView([local.lat, local.lon], 15);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapaDetalhe);
                        L.marker([local.lat, local.lon]).addTo(mapaDetalhe).bindPopup(local.nome).openPopup();
                    }
                    document.getElementById('btn-rota').href = `https://www.google.com/maps/search/?api=1&query=${local.lat},${local.lon}`;
                }
                await carregarComentariosFirebase();
            } catch (erro) { console.error(erro); }
        }

        async function verificarStatusFavorito(email) { const snap = await window.getDocFirebase(window.docFirebase(window.dbFirebase, "favoritos", `${email}_${idLocal}`)); if (snap.exists()) { isFavoritoAtivo = true; atualizarIconeCoracao(true); } }

        async function toggleFavorito() {
            const user = window.usuarioAtual;
            if (!user || !user.logado) return window.location.href = 'login.html';
            const docRef = window.docFirebase(window.dbFirebase, "favoritos", `${user.id}_${idLocal}`);
            if (isFavoritoAtivo) {
                await window.deleteDocFirebase(docRef);
                isFavoritoAtivo = false;
                atualizarIconeCoracao(false);
            } else {
                await window.setDocFirebase(docRef, { id_usuario: user.id, id_local: idLocal, nome_local: document.getElementById('nome-local').innerText, imagem: document.getElementById('img-local').src, categoria: document.getElementById('categoria-local').innerText, data_favoritado: new Date().toLocaleDateString('pt-BR') });
                isFavoritoAtivo = true;
                atualizarIconeCoracao(true);
            }
        }

        function atualizarIconeCoracao(ativo) { const i = document.getElementById('icone-coracao'); if (ativo) { i.classList.replace('bi-heart', 'bi-heart-fill'); i.classList.add('coracao-ativo'); } else { i.classList.replace('bi-heart-fill', 'bi-heart'); i.classList.remove('coracao-ativo'); } }

        async function carregarComentariosFirebase() {
            const q = window.queryFirebase(window.collectionFirebase(window.dbFirebase, "avaliacoes"), window.whereFirebase("id_local", "==", idLocal));
            const snap = await window.getDocsFirebase(q);
            renderizarComentarios(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        }

        // [cite: 173-174] - Proteção contra campos nulos ou indefinidos
        function renderizarComentarios(lista) {
            const div = document.getElementById('lista-comentarios');
            div.innerHTML = lista.length === 0 ? '<p class="text-center small mt-3 text-muted">Sem comentários.</p>' : '';

            lista.forEach(av => {
                // Verifica se o comentário existe, se não, coloca uma string vazia
                const textoComentario = av.comentario || "Sem descrição";
                const resp = av.resposta_parceiro ? `<div class="resposta-dono"><strong>Proprietário:</strong><br>${av.resposta_parceiro}</div>` : '';

                div.innerHTML += `
            <div class="comentario-item">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <img src="${av.foto_usuario || 'https://via.placeholder.com/35'}" style="width:35px;height:35px;border-radius:50%;object-fit:cover;">
                    <strong class="small">@${av.nome_usuario || 'Anônimo'}</strong>
                    <span class="text-warning ms-auto">${'★'.repeat(av.nota || 0)}</span>
                </div>
                <p class="comentario-texto mb-0">"${textoComentario}"</p>
                ${resp}
            </div>`;
            });
        }


        function contarCaracteres(c) {
            const texto = c.value;
            const quebras = (texto.match(/\n/g) || []).length;
            // Cada Enter vale 15 para desencorajar textos muito verticais
            const totalSimulado = texto.length + (quebras * 15);

            const contador = document.getElementById('contador-chars');
            contador.innerText = totalSimulado + " / 250";

            if (totalSimulado > 250) {
                contador.classList.add('text-danger', 'fw-bold');
            } else {
                contador.classList.remove('text-danger', 'fw-bold');
            }
        }

        function setNota(n) { notaSelecionada = n; document.querySelectorAll('.estrela').forEach(s => s.classList.toggle('ativa', Number(s.getAttribute('data-nota')) <= n)); }

        async function enviarAvaliacao() {
            const areaTexto = document.getElementById('texto-comentario');
            let txt = areaTexto.value.trim().replace(/\n{3,}/g, '\n\n'); // Máximo de 2 enters seguidos

            // Validação de peso no envio também
            const quebras = (txt.match(/\n/g) || []).length;
            if ((txt.length + (quebras * 10)) > 250) return alert("Comentário muito longo (diminua as quebras de linha)!");

            if (!notaSelecionada) return alert("Dê uma nota!");
            if (txt.length < 2) return alert("Escreva um comentário válido!");
            // ... restante do código [cite: 180-184]

            const u = window.usuarioAtual;
            try {
                const snap = await window.getDocsFirebase(window.queryFirebase(window.collectionFirebase(window.dbFirebase, "avaliacoes"), window.whereFirebase("id_usuario", "==", u.id), window.whereFirebase("id_local", "==", idLocal)));
                if (!snap.empty) return alert("Você já avaliou!");

                await window.addDocFirebase(window.collectionFirebase(window.dbFirebase, "avaliacoes"), {
                    comentario: txt,
                    data_avaliacao: new Date().toLocaleDateString('pt-BR'),
                    foto_usuario: u.foto,
                    id_local: idLocal,
                    id_usuario: u.id,
                    nome_usuario: u.nome,
                    nota: notaSelecionada
                });

                alert("Enviado!");
                areaTexto.value = "";
                setNota(0);
                document.getElementById('contador-chars').innerText = "0 / 250";
                carregarComentariosFirebase();
            } catch (e) { alert("Erro."); }
        }
    </script>
</body>

</html>
