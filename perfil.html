<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Perfil - Mundoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>

    <style>
        body {
            background: #f8f9fa;
            font-family: sans-serif;
        }

        .navbar {
            background: #fff;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .perfil-container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .perfil-header {
            background: #2c3e50;
            color: white;
            padding: 40px;
            text-align: center;
        }

        .perfil-foto-area {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
        }

        .foto-perfil {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            background: #eee;
        }

        .perfil-corpo {
            padding: 30px;
        }

        .btn-salvar {
            background: #f67123;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            width: 100%;
            border-radius: 8px;
        }

        .preview-crop {
            max-height: 400px;
            max-width: 100%;
        }

        .btn-excluir-conta {
            color: #dc3545;
            border: 1px solid #dc3545;
            background: none;
            font-size: 0.9em;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-excluir-conta:hover {
            background: #dc3545;
            color: white;
        }

        /* Estilo para campos travados */
        .input-travado {
            background-color: #f1f3f5 !important;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html" style="color: #f67123;">🌍 Mundoria</a>
            <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Voltar</a>
        </div>
    </nav>

    <div class="perfil-container">
        <div class="perfil-header">
            <div class="perfil-foto-area">
                <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" id="img-perfil" class="foto-perfil">
            </div>
            <h3 id="nome-exibicao" class="fw-bold m-0">Carregando...</h3>
            <input type="file" id="input-foto" class="d-none" accept="image/*">
            <button class="btn btn-sm btn-outline-light mt-3" onclick="document.getElementById('input-foto').click()">
                <i class="bi bi-camera"></i> Alterar Foto
            </button>
        </div>

        <div class="perfil-corpo">
            <form id="form-perfil">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Nome</label>
                        <input type="text" id="perfil-nome" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">E-mail</label>
                        <input type="email" id="perfil-email" class="form-control" readonly
                            style="background: #e9ecef;">
                    </div>
                </div>

                <h5 class="fw-bold mt-4 mb-3"><i class="bi bi-geo-alt-fill text-danger"></i> Minha Localização</h5>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold">CEP (Valida o endereço)</label>
                        <input type="text" id="perfil-cep" class="form-control" placeholder="00000-000">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold">País</label>
                        <input type="text" id="perfil-pais" class="form-control input-travado" value="Brasil" readonly>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">Endereço (Preenchido pelo CEP)</label>
                    <input type="text" id="perfil-endereco" class="form-control input-travado" readonly
                        placeholder="Digite o CEP para preencher">
                </div>

                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="form-label small fw-bold">Cidade</label>
                        <input type="text" id="perfil-cidade" class="form-control input-travado" readonly>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label small fw-bold">Estado (UF)</label>
                        <input type="text" id="perfil-estado" class="form-control input-travado" readonly>
                    </div>
                </div>

                <button type="submit" class="btn btn-salvar mt-3" id="btn-submit-perfil">Salvar Alterações</button>

                <div class="mt-4 p-3 border rounded bg-light text-center">
                    <p class="small text-muted mb-2">Deseja mudar sua senha de acesso?</p>
                    <button type="button" class="btn btn-sm btn-outline-primary fw-bold" id="btn-redefinir-senha">
                        <i class="bi bi-shield-lock"></i> Enviar E-mail de Troca de Senha
                    </button>
                </div>
            </form>

            <hr class="mt-5">
            <div class="text-center">
                <button class="btn btn-sm btn-excluir-conta rounded-pill px-4" id="btn-deletar-perfil">
                    <i class="bi bi-person-x"></i> Excluir Minha Conta Permanentemente
                </button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalCrop" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Ajustar Foto de Perfil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <div><img id="image-to-crop" class="preview-crop"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-confirmar-corte">Cortar e Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script type="module">
        // Importações unificadas e corrigidas
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, deleteUser, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-storage.js";

        import { firebaseConfig } from './config.js';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        $(document).ready(function () {
            $('#perfil-cep').mask('00000-000');
        });

        let cropper = null;
        const modalCrop = new bootstrap.Modal(document.getElementById('modalCrop'));
        const imageToCrop = document.getElementById('image-to-crop');

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const emailId = user.email.toLowerCase();
            const userSnap = await getDoc(doc(db, "users", emailId));

            if (userSnap.exists()) {
                const data = userSnap.data();
                const end = data.endereco; // Pega o objeto de endereço

                document.getElementById('img-perfil').src = data.foto || 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
                document.getElementById('nome-exibicao').innerText = data.nome;
                document.getElementById('perfil-nome').value = data.nome;
                document.getElementById('perfil-email').value = data.email;
                document.getElementById('perfil-pais').value = data.pais || 'Brasil';

                // TRATAMENTO DO NOVO FORMATO (OBJETO)
                if (typeof end === 'object' && end !== null) {
                    // BUSCA O CEP DENTRO DO OBJETO ENDEREÇO
                    document.getElementById('perfil-cep').value = end.cep || data.cep || '';
                    document.getElementById('perfil-endereco').value = end.rua || '';
                    document.getElementById('perfil-cidade').value = end.cidade || '';
                    document.getElementById('perfil-estado').value = end.estado || '';
                } else {
                    // Caso ainda existam dados no formato antigo (string)
                    document.getElementById('perfil-cep').value = data.cep || '';
                    document.getElementById('perfil-endereco').value = end || '';
                    document.getElementById('perfil-cidade').value = data.cidade || '';
                    document.getElementById('perfil-estado').value = data.estado || '';
                }
            }
        });

        // BUSCA POR CEP COM TRAVA DE EDIÇÃO
        document.getElementById('perfil-cep').addEventListener('blur', async function () {
            const cep = this.value.replace(/\D/g, '');
            if (cep.length !== 8) return;

            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();

                if (!data.erro) {
                    document.getElementById('perfil-endereco').value = data.logradouro;
                    document.getElementById('perfil-cidade').value = data.localidade;
                    document.getElementById('perfil-estado').value = data.uf;
                } else {
                    alert("CEP não encontrado. Verifique e tente novamente.");
                }
            } catch (e) {
                console.error("Erro ao buscar CEP:", e);
            }
        });

        // LÓGICA DE FOTO
        document.getElementById('input-foto').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    imageToCrop.src = event.target.result; modalCrop.show();
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(imageToCrop, { aspectRatio: 1, viewMode: 1 });
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('btn-confirmar-corte').addEventListener('click', async () => {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: 300, height: 300 });
            const btnConfirmar = document.getElementById('btn-confirmar-corte');
            btnConfirmar.disabled = true; btnConfirmar.innerText = "Enviando...";
            canvas.toBlob(async (blob) => {
                const user = auth.currentUser;
                const emailId = user.email.toLowerCase();
                const storageRef = ref(storage, `perfis/${emailId}.png`);
                try {
                    await uploadBytes(storageRef, blob);
                    const photoURL = await getDownloadURL(storageRef);
                    await updateDoc(doc(db, "users", emailId), { foto: photoURL });
                    document.getElementById('img-perfil').src = photoURL;
                    modalCrop.hide(); alert("Foto atualizada!");
                } catch (e) { alert("Erro no Storage."); } finally { btnConfirmar.disabled = false; btnConfirmar.innerText = "Cortar e Salvar"; }
            });
        });

        // SALVAR DADOS
        document.getElementById('form-perfil').addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailId = auth.currentUser.email.toLowerCase();

            const novosDados = {
                nome: document.getElementById('perfil-nome').value,
                pais: document.getElementById('perfil-pais').value,
                // AGORA O CEP ENTRA AQUI DENTRO TAMBÉM
                endereco: {
                    cep: document.getElementById('perfil-cep').value, // <-- CEP agora é parte do endereço
                    rua: document.getElementById('perfil-endereco').value,
                    cidade: document.getElementById('perfil-cidade').value,
                    estado: document.getElementById('perfil-estado').value
                }
            };

            try {
                await updateDoc(doc(db, "users", emailId), novosDados);
                alert("Perfil atualizado! CEP agora está no lugar certo.");
                // Opcional: recarregar para limpar o campo antigo que ficou fora do objeto
                location.reload();
            } catch (e) {
                console.error(e);
                alert("Erro ao salvar.");
            }
        });

        // EXCLUIR CONTA
        document.getElementById('btn-deletar-perfil').addEventListener('click', async () => {
            const confirmacao = confirm("ATENÇÃO: Você tem certeza que deseja excluir sua conta?");
            if (confirmacao) {
                const user = auth.currentUser;
                const emailId = user.email.toLowerCase();
                try {
                    await deleteDoc(doc(db, "users", emailId));
                    await deleteUser(user);
                    alert("Conta excluída.");
                    window.location.href = "index.html";
                } catch (error) {
                    if (error.code === 'auth/requires-recent-login') {
                        alert("Por segurança, saia e faça login novamente para excluir.");
                    } else { alert("Erro ao excluir."); }
                }
            }
        });

        // Lógica para enviar e-mail de redefinição de senha
        document.getElementById('btn-redefinir-senha').addEventListener('click', async () => {
            const email = auth.currentUser.email;

            if (confirm("Enviaremos um link para o seu e-mail para você criar uma nova senha. Confirma?")) {
                try {
                    await sendPasswordResetEmail(auth, email);
                    alert("Sucesso! Verifique sua caixa de entrada (e o spam) para alterar a senha.");
                } catch (error) {
                    alert("Erro ao tentar enviar o e-mail. Tente novamente mais tarde.");
                    console.error(error);
                }
            }
        });
    </script>
</body>

</html>
