<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Mundoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            font-family: sans-serif;
            background-color: #f8f9fa;
        }

        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .hero {
            background: #2c3e50;
            color: white;
            padding: 100px 20px 120px 20px;
            /* Aumentado o padding inferior para dar respiro */
            text-align: center;
            margin-bottom: 50px;
            /* Aumentada a margem para afastar as categorias */
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1200');
            background-size: cover;
            background-position: center;
        }

        .search-box {
            background: white;
            padding: 8px 15px;
            /* Ajustado para não apertar os inputs */
            border-radius: 50px;
            display: flex;
            max-width: 850px;
            /* Levemente aumentada para comportar os dois campos */
            margin: 20px auto;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            /* Garante que nada saia das bordas arredondadas */
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .search-input {
            border: none;
            outline: none;
            flex-grow: 1;
            padding: 12px 15px;
            font-size: 1rem;
            width: 100%;
            /* Garante que o input ocupe o espaço interno */
        }

        .search-btn {
            background: #f67123;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-btn:hover {
            background: #d95e16;
        }

        .filtros-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .btn-nicho {
            background-color: white;
            border: 2px solid #00008b;
            color: #00008b;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-nicho:hover,
        .btn-nicho.ativo {
            background-color: #00008b;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(0, 0, 139, 0.2);
        }

        .card-evento {
            transition: transform 0.2s;
            cursor: pointer;
            border: none;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .card-evento:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .card-img-top {
            height: 200px;
            object-fit: cover;
        }

        .badge-data {
            background: #f67123;
            color: white;
            font-size: 0.8em;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .badge-categoria {
            background: #00008b;
            color: white;
            font-size: 0.8em;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .btn-menu-azul {
            width: 45px;
            height: 45px;
            background-color: #00008b;
            color: white;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-menu-azul:hover {
            background-color: #00005c;
            color: white;
        }

        .dropdown-toggle::after {
            display: none;
        }

        .user-avatar-mini {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #f67123;
        }

        .btn-admin-link {
            background-color: #343a40;
            color: white;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 0.9em;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
            border: none;
        }

        .btn-admin-link:hover {
            background-color: #23272b;
            color: white;
            transform: scale(1.05);
        }

        .btn-analista-link {
            background-color: #00008b;
            color: white;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 0.9em;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
            border: none;
        }

        .btn-analista-link:hover {
            background-color: #00005c;
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html" style="color: #f67123;">🌍 Mundoria</a>
            <div class="d-flex align-items-center gap-3" id="menu-usuario"></div>
        </div>
    </nav>

    <div class="hero">
        <h1 class="fw-bold display-5 mb-3">Explore o Autêntico</h1>
        <p class="lead mb-4">Descubra experiências únicas longe do turismo de massa.</p>

        <div class="search-box shadow-lg d-flex align-items-center p-2 mx-auto"
            style="max-width: 800px; border-radius: 50px; background: white;">
            <div class="d-flex align-items-center flex-grow-1 px-3 border-end">
                <i class="bi bi-search text-muted me-2"></i>
                <input type="text" id="input-busca" class="border-0 w-100 search-input" style="outline: none;"
                    placeholder="O que você procura?" onkeyup="aplicarFiltros()">
            </div>
            <div class="d-flex align-items-center flex-grow-1 px-3">
                <i class="bi bi-geo-alt text-laranja me-2"></i>
                <input type="text" id="input-localidade" class="border-0 w-100 search-input" style="outline: none;"
                    placeholder="Cidade, Bairro ou Estado (ex: SP)" onkeyup="aplicarFiltros()">
            </div>
            <button class="search-btn rounded-pill px-4 ms-2">Buscar</button>
        </div>

        <div class="d-flex flex-column align-items-center mt-3">
            <div class="d-flex align-items-center gap-2 flex-wrap justify-content-center">
                <div class="input-group input-group-sm shadow-sm" style="width: auto;">
                    <span class="input-group-text bg-white border-0 text-primary">
                        <i class="bi bi-lightning-charge-fill"></i>
                    </span>
                    <select id="qtd-populacao" class="form-select border-0 fw-bold text-muted" style="width: 70px;">
                        <option value="4">4</option>
                        <option value="8" selected>8</option>
                        <option value="16">16</option>
                        <option value="32">32</option>
                    </select>
                </div>

                <button id="btn-gps-popular" class="btn btn-primary btn-sm rounded-pill shadow-sm fw-bold px-3"
                    onclick="window.filtrarPorGpsPopular()">
                    <i class="bi bi-geo-fill"></i> Explorar Nova Área
                </button>

                <button id="btn-radar" class="btn btn-light btn-sm rounded-pill shadow-sm text-primary fw-bold px-3"
                    onclick="window.radarLocaisExistentes()">
                    <i class="bi bi-radar"></i> Radar Mundoria
                </button>

                <button class="btn btn-light btn-sm rounded-pill shadow-sm text-laranja fw-bold px-3"
                    onclick="window.filtrarPorEnderecoPerfil()">
                    <i class="bi bi-house-heart-fill"></i> Perto de Casa
                </button>
            </div>
            <div class="mt-2 text-white fw-medium shadow-sm"
                style="font-size: 0.8rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);">
                <i class="bi bi-info-circle-fill text-warning me-1"></i>
                Use o "Explorar" para descobrir novos locais. O "Radar" mostra o que já conhecemos.
            </div>
        </div>
    </div>

    <div class="container mb-5">
        <div class="container mt-4 mb-5">
            <div class="filtros-container d-flex justify-content-center gap-2 flex-wrap">
                <button class="btn-nicho ativo px-4 shadow-sm" onclick="filtrarNicho('todos', this)">✨ Todos</button>
                <button class="btn-nicho shadow-sm" onclick="filtrarNicho('Restaurante', this)"><i
                        class="bi bi-cup-hot"></i> Gastronomia</button>
                <button class="btn-nicho shadow-sm" onclick="filtrarNicho('Parque', this)"><i class="bi bi-tree"></i>
                    Natureza</button>
                <button class="btn-nicho shadow-sm" onclick="filtrarNicho('Museu', this)"><i class="bi bi-bank"></i>
                    Cultura</button>
                <button class="btn-nicho shadow-sm" onclick="filtrarNicho('Lazer', this)"><i
                        class="bi bi-controller"></i> Lazer</button>
                <button class="btn-nicho shadow-sm" onclick="filtrarNicho('Feira', this)"><i class="bi bi-shop"></i>
                    Feiras</button>
            </div>
        </div>

        <h3 class="text-muted mb-4 border-bottom pb-2">Resultados da Busca</h3>
        <div id="grade-conteudo" class="row">
            <p class="text-center">Carregando experiências...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, query, where, addDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDGDvRBfJlztDRpQS1MHkYlDQst7ZtfHCo",
            authDomain: "mundoria-53de5.firebaseapp.com",
            projectId: "mundoria-53de5",
            storageBucket: "mundoria-53de5.firebasestorage.app",
            messagingSenderId: "86901345396",
            appId: "1:86901345396:web:969fa3637292d0333e1521"
        };
        // 3. INICIALIZAÇÃO
        const appFirebase = initializeApp(firebaseConfig);
        const dbFirebase = getFirestore(appFirebase);
        const authFirebase = getAuth(appFirebase);

        // 4. O PULO DO GATO (Tornar as funções e o banco globais para as APIs abaixo)
        window.dbFirebase = dbFirebase;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.updateDoc = updateDoc;
        window.collectionFirebase = collection;
        window.getDocsFirebase = getDocs;
        window.queryFirebase = query;
        window.whereFirebase = where;

        window.dbFirebase = dbFirebase;
        window.collectionFirebase = collection;
        window.getDocsFirebase = getDocs;
        window.queryFirebase = query;
        window.whereFirebase = where;

        const menu = document.getElementById('menu-usuario');
        onAuthStateChanged(authFirebase, async (user) => {
            if (user) {
                window.isLogado = true;
                const emailId = user.email.toLowerCase();
                const userSnap = await getDoc(doc(dbFirebase, "users", emailId));

                const data = userSnap.exists() ? userSnap.data() : {
                    nome: "Usuário",
                    foto: "https://cdn-icons-png.flaticon.com/512/847/847969.png",
                    tipo: "turista"
                };

                window.usuarioGlobal = { id: emailId, ...data };

                if (data.tipo === 'admin' || data.tipo === 'produtor' || data.tipo === 'analista') {
                    let linkPainel = '';
                    let textoBotao = 'Painel de Gestão';
                    let classeBotao = 'btn-admin-link';
                    let icone = 'bi-gear-fill';

                    if (data.tipo === 'admin') {
                        linkPainel = 'painel_admin.html';
                    } else if (data.tipo === 'produtor') {
                        linkPainel = 'painel.html';
                    } else if (data.tipo === 'analista') {
                        linkPainel = 'painel_analista.html';
                        textoBotao = 'Relatórios BI';
                        classeBotao = 'btn-analista-link';
                        icone = 'bi-bar-chart-line-fill';
                    }

                    menu.innerHTML = `
                    <a href="${linkPainel}" class="${classeBotao}"><i class="bi ${icone}"></i> ${textoBotao}</a>
                    <a href="perfil.html" class="text-decoration-none d-flex align-items-center gap-2 text-dark">
                        <img src="${data.foto}" class="user-avatar-mini">
                        <span class="fw-bold d-none d-md-block">${data.nome}</span>
                    </a>
                    <button class="btn btn-outline-danger btn-sm ms-2" id="btn-sair">Sair</button>
                `;
                } else {
                    let badgeTipo = '';
                    if (data.tipo === 'parceiro') {
                        badgeTipo = `
                        <li><hr class="dropdown-divider"></li>
                        <li><span class="dropdown-item-text text-primary fw-bold"><i class="bi bi-shop"></i> Você é Parceiro</span></li>
                        <li><button class="dropdown-item text-secondary small" onclick="window.cancelarAssinatura()"><i class="bi bi-x-circle me-2"></i> Cancelar Assinatura</button></li>
                    `;
                    } else {
                        badgeTipo = `<li><hr class="dropdown-divider"></li><li><a class="dropdown-item fw-bold text-warning" href="planos.html">⭐ Seja Parceiro</a></li>`;
                    }

                    menu.innerHTML = `
                    <a href="perfil.html" class="text-decoration-none d-flex align-items-center gap-2 text-dark">
                        <img src="${data.foto}" class="user-avatar-mini">
                        <span class="fw-bold d-none d-md-block">${data.nome}</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn-menu-azul dropdown-toggle" type="button" data-bs-toggle="dropdown"><i class="bi bi-list"></i></button>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 p-3">
                            <li><h6 class="dropdown-header">Menu</h6></li>
                            <li><a class="dropdown-item" href="meu_painel.html"><i class="bi bi-grid-fill me-2"></i> Meu Painel</a></li>
                            ${badgeTipo}
                            <li><hr class="dropdown-divider"></li>
                            <li><button class="dropdown-item text-danger" id="btn-sair">Sair</button></li>
                        </ul>
                    </div>`;
                }

                document.getElementById('btn-sair').addEventListener('click', () => {
                    if (confirm('Deseja realmente sair?')) {
                        signOut(authFirebase).then(() => location.reload());
                    }
                });
            } else {
                window.isLogado = false;
                window.usuarioGlobal = null;
                menu.innerHTML = `
                <a href="login.html" class="btn btn-outline-secondary btn-sm me-2">Login</a>
                <a href="cadastro.html" class="btn btn-primary btn-sm" style="background:#f67123; border:none;">Cadastre-se</a>
            `;
            }
            carregarLocais();
        });

        // Função para cancelar assinatura (Voltar a ser Turista)
        // Função para cancelar assinatura (Voltar a ser Turista e Desativar Locais)
        // Função ATUALIZADA: Cancela assinatura e DESATIVA os locais usando o campo correto 'id_parceiro'
        window.cancelarAssinatura = async () => {
            if (confirm("Tem certeza que deseja cancelar sua assinatura? Seus estabelecimentos cadastrados serão DESATIVADOS e você voltará a ser um Turista comum.")) {
                try {
                    const userEmail = window.usuarioGlobal.id;
                    const userRef = doc(dbFirebase, "users", userEmail);

                    // 1. Volta o usuário para o tipo Turista
                    await updateDoc(userRef, { tipo: "turista" });

                    // 2. Busca todos os locais onde o 'id_parceiro' é o e-mail do usuário
                    // Conforme imagem do banco de dados, o campo correto é id_parceiro
                    const locaisRef = collection(dbFirebase, "locais");
                    const qLocais = query(locaisRef, where("id_parceiro", "==", userEmail));
                    const snapLocais = await getDocs(qLocais);

                    if (!snapLocais.empty) {
                        const batchPromessas = [];
                        snapLocais.forEach((docLocal) => {
                            const refLocal = doc(dbFirebase, "locais", docLocal.id);
                            // 3. Muda o status para 'desativado' para que suma do index.html
                            batchPromessas.push(updateDoc(refLocal, { status: "desativado" }));
                        });

                        // Aguarda a atualização de todos os estabelecimentos
                        await Promise.all(batchPromessas);
                        alert("Assinatura cancelada! Seus estabelecimentos foram retirados do ar.");
                    } else {
                        alert("Assinatura cancelada com sucesso!");
                    }

                    // 4. Recarrega para atualizar a interface
                    location.reload();
                } catch (e) {
                    console.error("Erro ao cancelar:", e);
                    alert("Erro ao processar o cancelamento da assinatura.");
                }
            }
        };

        window.abrirModalRoteiro = async (idLocal, event) => {
            // Impede que o clique no botão abra também a página de detalhes do card 
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            if (!window.isLogado || !window.usuarioGlobal) {
                alert("Faça login para adicionar ao roteiro!");
                window.location.href = 'login.html';
                return;
            }

            // Salva o ID do local no campo oculto [cite: 87]
            document.getElementById('id-local-temp').value = idLocal;

            const select = document.getElementById('select-roteiros');
            select.innerHTML = '<option value="">Buscando seus roteiros...</option>';

            const modalElement = document.getElementById('modalAddRoteiro');
            const modal = new bootstrap.Modal(modalElement);
            modal.show();

            try {
                const q = query(collection(dbFirebase, "roteiros"), where("id_usuario", "==", window.usuarioGlobal.id));
                const snap = await getDocs(q);

                if (snap.empty) {
                    select.innerHTML = '<option value="">Você não tem roteiros. Crie um no Painel!</option>';
                    return;
                }

                select.innerHTML = '<option value="" selected disabled>Escolha um roteiro...</option>';
                snap.forEach(doc => {
                    select.innerHTML += `<option value="${doc.id}">${doc.data().nome_roteiro}</option>`;
                });
            } catch (e) {
                console.error(e);
                select.innerHTML = '<option>Erro ao carregar roteiros.</option>';
            }
        };

        window.confirmarAdicaoRoteiro = async () => {
            const idRoteiro = document.getElementById('select-roteiros').value;
            const idLocal = document.getElementById('id-local-temp').value;
            if (!idRoteiro) return alert("Selecione um roteiro da lista!");
            try {
                await addDoc(collection(dbFirebase, "roteiro_itens"), { id_roteiro: idRoteiro, id_local: idLocal, horario: "" });
                alert("Local adicionado com sucesso ao seu roteiro!");
                bootstrap.Modal.getInstance(document.getElementById('modalAddRoteiro')).hide();
            } catch (e) {
                console.error(e);
                alert("Erro ao salvar local no roteiro.");
            }
        };
    </script>

    <script>
        let locaisGlobais = [];
        let filtroAtual = 'todos';

        // ATUALIZAÇÃO: Tabela de mapeamento para filtros consistentes
        const mapaCategorias = {
            'Restaurante': ['Restaurante', 'Bar', 'Café', 'Cafeteria', 'Lanchonete', 'Padaria', 'Gastronomia'],
            'Parque': ['Parque', 'Trilha', 'Mirante', 'Natureza', 'Praia'],
            'Museu': ['Museu', 'Cultura', 'Teatro', 'Igreja', 'Monumento'],
            'Feira': ['Feira', 'Mercado', 'Artesanato'],
            'Lazer': ['Bar', 'Show', 'Balada', 'Cinema', 'Lazer', 'Entretenimento']
        };

        async function carregarLocais() {
            try {
                const locaisRef = window.collectionFirebase(window.dbFirebase, "locais");
                const q = window.queryFirebase(locaisRef, window.whereFirebase("status", "==", "ativo"));
                const snap = await window.getDocsFirebase(q);
                locaisGlobais = [];
                snap.forEach((doc) => { locaisGlobais.push({ id: doc.id, ...doc.data() }); });
                renderizarLocais(locaisGlobais);
            } catch (erro) { console.error("Erro ao carregar locais:", erro); }
        }

        function renderizarLocais(lista) {
            const div = document.getElementById('grade-conteudo');
            div.innerHTML = lista.length === 0 ? '<div class="col-12 text-center text-muted py-5"><h4>Nenhum local encontrado nesta categoria.</h4></div>' : '';
            lista.forEach(item => {
                let etiqueta = item.tipo_local === 'evento' ? `📅 ${item.data_evento}` : `📍 ${item.categoria}`;

                let botoesAcao = (window.usuarioGlobal && (window.usuarioGlobal.tipo === 'admin' || window.usuarioGlobal.tipo === 'produtor' || window.usuarioGlobal.tipo === 'analista'))
                    ? `<a href="detalhes.html?id=${item.id}" class="btn btn-primary w-100 btn-sm fw-bold">Ver Detalhes (Gestão)</a>`
                    : `<button class="btn btn-outline-success w-50 btn-sm fw-bold" onclick="window.abrirModalRoteiro('${item.id}', event)">+ Roteiro</button>
                   <a href="detalhes.html?id=${item.id}" class="btn btn-primary w-50 btn-sm fw-bold">Detalhes</a>`;

                div.innerHTML += `
                <div class="col-md-4 mb-4">
                    <div class="card card-evento h-100 shadow-sm" onclick="window.location.href='detalhes.html?id=${item.id}'">
                        <img src="${item.imagem}" class="card-img-top">
                        <div class="card-body d-flex flex-column">
                            <div>
                                <span class="badge-categoria mb-2 d-inline-block">${etiqueta}</span>
                                <h5 class="card-title fw-bold mt-2">${item.nome}</h5>
                                <p class="card-text text-secondary small">${item.descricao.substring(0, 80)}...</p>
                            </div>
                            <div class="mt-auto pt-3 d-flex gap-2">${botoesAcao}</div>
                        </div>
                    </div>
                </div>`;
            });
        }

        function aplicarFiltros() {
            const termo = document.getElementById('input-busca').value.toLowerCase().trim();
            const localidade = document.getElementById('input-localidade').value.toLowerCase().trim();

            const filtrados = locaisGlobais.filter(item => {
                // 1. Filtro por Categoria (Nicho)
                let bateNicho = false;
                if (filtroAtual === 'todos') {
                    bateNicho = true;
                } else {
                    const categoriasPermitidas = mapaCategorias[filtroAtual] || [filtroAtual];
                    bateNicho = categoriasPermitidas.some(cat =>
                        item.categoria.toLowerCase() === cat.toLowerCase()
                    );
                }

                // 2. Filtro por Texto (Nome ou Descrição)
                const bateTexto = item.nome.toLowerCase().includes(termo) ||
                    item.descricao.toLowerCase().includes(termo);

                // 3. Filtro por Localidade (Cidade, Rua ou Estado)
                let enderecoCompleto = "";
                if (typeof item.endereco === 'object' && item.endereco !== null) {
                    // Concatena todos os campos para uma busca abrangente
                    enderecoCompleto = `${item.endereco.rua} ${item.endereco.cidade} ${item.endereco.estado}`.toLowerCase();
                } else {
                    enderecoCompleto = String(item.endereco || "").toLowerCase();
                }

                const bateLocal = enderecoCompleto.includes(localidade);

                return bateNicho && bateTexto && bateLocal;
            });
            renderizarLocais(filtrados);
        }

        function filtrarNicho(c, b) {
            filtroAtual = c;

        // Variável para controlar qual filtro geográfico está ativo
        let filtroGeoAtivo = null;

        // Variável global para saber qual filtro está ligado
        let filtroAtivo = null;

        // --- FUNÇÃO 1: GPS (COM DESATIVAR) ---
        window.filtrarPorGps = () => {
            const btn = event.currentTarget;

            if (filtroAtivo === 'gps') {
                filtroAtivo = null;
                resetarEstiloBotao(btn, 'text-primary');
                renderizarLocais(locaisGlobais);
                return;
            }

            if (!navigator.geolocation) return alert("Seu navegador não suporta geolocalização.");

            // Pega a quantidade escolhida no seletor (ex: 4)
            const qtdLimite = parseInt(document.getElementById('qtd-populacao').value) || 4;
            const textoOriginal = btn.innerHTML;

            // Feedback visual para o usuário
            btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Populando ${qtdLimite} locais...`;

            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const latUser = pos.coords.latitude;
                    const lonUser = pos.coords.longitude;

                    // 1. O ROBÔ POPULA O BANCO: Busca e salva exatamente a quantidade escolhida
                    console.log(`🚀 Iniciando carga de ${qtdLimite} locais via GPS...`);
                    await window.popularAreaPorDemanda(latUser, lonUser, qtdLimite);

                    // 2. RECARREGA A LISTA: Puxa tudo do Firebase de novo, incluindo os novos 4 locais
                    await carregarLocais();

                    // 3. ATUALIZA A INTERFACE
                    resetarTodosBotoes();
                    filtroAtivo = 'gps';
                    btn.classList.replace('btn-light', 'btn-primary');
                    btn.classList.replace('text-primary', 'text-white');
                    btn.innerHTML = textoOriginal;

                    // 4. MOSTRA O RESULTADO: Filtra apenas os que estão num raio de 10km
                    const proximos = locaisGlobais.filter(local => {
                        const distancia = calcularDistancia(latUser, lonUser, local.lat, local.lon);
                        return distancia <= 10;
                    });

                    renderizarLocais(proximos);
                    console.log("✅ População e filtragem concluídas!");

                } catch (erro) {
                    console.error("Erro ao popular via GPS:", erro);
                    btn.innerHTML = textoOriginal;
                    alert("Erro ao processar novos locais.");
                }
            }, (erro) => {
                btn.innerHTML = textoOriginal;
                alert("Ative seu GPS para popular a área.");
            });

        // --- FUNÇÃO 2: PERFIL (COM DESATIVAR E AVISO DE CIDADE) ---
        window.filtrarPorEnderecoPerfil = () => {
            const btn = event.currentTarget;

            // Se já estiver ativo, desliga e mostra tudo
            if (filtroAtivo === 'perfil') {
                filtroAtivo = null;

                renderizarLocais(locaisGlobais);
                return;
            }

            // Puxa os dados do usuário global [cite: 518, 519]

            const cidadePerfil = window.usuarioGlobal.cidade;
            if (!cidadePerfil) return alert("Cadastre sua cidade no Perfil!");

            // Limpa outros filtros antes
            resetarTodosBotoes();

            filtroAtivo = 'perfil';
            btn.classList.replace('btn-light', 'btn-primary');
            btn.classList.replace('text-laranja', 'text-white');

            const pertoDeCasa = locaisGlobais.filter(local => {
                const enderecoLocal = typeof local.endereco === 'object' ? local.endereco.cidade : String(local.endereco);
                return enderecoLocal.toLowerCase().includes(cidadePerfil.toLowerCase());
            });

            if (pertoDeCasa.length === 0) {
                alert(`Ainda não temos locais cadastrados em ${cidadePerfil}.`);

            renderizarLocais(pertoDeCasa);

        // --- FUNÇÕES DE APOIO ---

        function resetarEstiloBotao(btn, classeCorOriginal) {
            btn.classList.remove('btn-primary', 'text-white');
            btn.classList.add('btn-light', classeCorOriginal);
        }

        function resetarTodosBotoes() {
            const btnGps = document.querySelector('[onclick*="filtrarPorGps"]');
            const btnPerfil = document.querySelector('[onclick*="filtrarPorEnderecoPerfil"]');
            if (btnGps) resetarEstiloBotao(btnGps, 'text-primary');
            if (btnPerfil) resetarEstiloBotao(btnPerfil, 'text-laranja');
        }

        // Sua função Haversine que já funciona perfeitamente
        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // APIs

        // Filtro rigoroso: Só aceita o que é público e gratuito
        const mapearCategoriaPublica = (tags) => {
            if (tags.leisure === 'park' || tags.leisure === 'garden' || tags.leisure === 'nature_reserve') return "Natureza";
            if (tags.leisure === 'playground' || tags.leisure === 'recreation_ground') return "Lazer";
            if (tags.tourism === 'museum') return "Museu";
            if (tags.tourism === 'artwork' || tags.amenity === 'arts_centre' || tags.historic) return "Cultura";
            if (tags.amenity === 'marketplace') return "Feiras";
            return null; // Bloqueia Restaurantes, Bares, Cafés e Lojas (Privados)
        };

        // 1. FUNÇÃO DE VARREDURA (DELAY AJUSTADO PARA EVITAR BLOQUEIO)
        window.popularAreaPorDemanda = async function (lat, lng, limite, callbackProgresso) {
            const url = "https://overpass.openstreetmap.fr/api/interpreter";
            const query = `[out:json][timeout:90];(nwr["leisure"~"park|garden|playground|nature_reserve|beach_resort"](around:2000,${lat},${lng});nwr["tourism"~"viewpoint|museum|attraction|artwork"](around:2000,${lat},${lng});nwr["historic"](around:2000,${lat},${lng}););out center ${limite};`;

            try {
                const response = await fetch(url, { method: 'POST', body: `data=${encodeURIComponent(query)}` });
                const data = await response.json();

                if (data.elements) {
                    let processados = 0;
                    for (const el of data.elements.slice(0, limite)) {
                        processados++;
                        // Chama a função que atualiza o texto do botão
                        if (callbackProgresso) callbackProgresso(processados, limite);

                        if (el.tags && el.tags.name) {
                            await new Promise(r => setTimeout(r, 1500));
                            // Lógica de categoria e salvamento que você já tem...
                            let cat = el.tags.tourism === 'museum' ? 'Cultura' : 'Lazer';
                            await window.salvarLocalAPI({ ...el, lat: el.lat || el.center.lat, lon: el.lon || el.center.lon }, cat);
                        }
                    }
                }
            } catch (e) { console.error(e); }
        };

        // 2. FUNÇÃO DE SALVAMENTO (COM PROTEÇÃO CONTRA ERRO 429 E CORS)
        window.salvarLocalAPI = async function (el, cat) {
            const idUnico = `api_${el.id}`;
            const refDoc = window.doc(window.dbFirebase, "locais", idUnico);

            try {
                const snap = await window.getDoc(refDoc);
                if (snap.exists()) return;

                // 1. Busca endereço real dinâmico
                let enderecoFormatado = "Endereço não disponível";
                let cidadeReal = "Cidade não identificada";
                let estadoReal = "SP";
                let cepReal = "";

                try {
                    const resEnd = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${el.lat}&lon=${el.lon}`);
                    if (resEnd.ok) {
                        const dataEnd = await resEnd.json();
                        enderecoFormatado = dataEnd.display_name.split(',').slice(0, 3).join(',');
                        cidadeReal = dataEnd.address.city || dataEnd.address.town || dataEnd.address.village || "Cidade não identificada";
                        estadoReal = dataEnd.address.state || "SP";
                        cepReal = dataEnd.address.postcode || "";
                    }
                } catch (err) { console.warn("Erro ao buscar endereço real."); }

                // 2. Lógica de Imagens com Validação de Link
                const imagensIlustrativas = {
                    "Natureza": "img/ilustrativa_natureza.jpg",
                    "Cultura": "img/ilustrativa_cultura.jpg",
                    "Lazer": "img/ilustrativa_lazer.jpg",
                    "Feiras": "img/ilustrativa_feiras.jpg",
                    "Museu": "img/ilustrativa_museu.jpg"
                };
                let fotoFinal = imagensIlustrativas[cat] || "img/ilustrativa_geral.jpg";

                // Função para garantir que o link é um endereço de internet válido (http/https)
                const ehLinkValido = (url) => url && url.startsWith('http');

                if (ehLinkValido(el.tags.image)) {
                    fotoFinal = el.tags.image;
                } else if (el.tags.wikipedia) {
                    try {
                        const wikiTermo = el.tags.wikipedia.split(':')[1];
                        const wikiRes = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiTermo)}`);
                        const wikiData = await wikiRes.json();
                        // Só aceita a foto da Wikipédia se o link for válido para a web
                        if (wikiData.thumbnail && ehLinkValido(wikiData.thumbnail.source)) {
                            fotoFinal = wikiData.thumbnail.source;
                        }
                    } catch (e) { }
                }

                // 3. Montagem do Objeto
                const dados = {
                    nome: el.tags.name,
                    categoria: cat,
                    descricao: `${el.tags.name} é um local público de ${cat.toLowerCase()} localizado em ${cidadeReal}.`,
                    tipo_local: "api",
                    status: "ativo",
                    imagem: fotoFinal,
                    lat: el.lat,
                    lon: el.lon,
                    endereco: {
                        rua: enderecoFormatado,
                        cidade: cidadeReal,
                        estado: estadoReal,
                        cep: cepReal
                    }
                };

                if (el.tags.opening_hours) dados.horario = el.tags.opening_hours;
                if (el.tags.phone || el.tags["contact:phone"]) dados.telefone = el.tags.phone || el.tags["contact:phone"];

                await window.setDoc(refDoc, dados);
                console.log(`✅ SALVO EM ${cidadeReal.toUpperCase()}: ${el.tags.name}`);

            } catch (e) { console.error("Erro ao processar:", e); }
        };

        window.radarLocaisExistentes = async () => {

            navigator.geolocation.getCurrentPosition(async (pos) => {

        };

        window.filtrarPorGpsPopular = async () => {

                    });

                    await carregarLocais();
                    btn.innerHTML = textoOriginal;
                    window.radarLocaisExistentes(); // Filtra automaticamente após popular

                } catch (erro) {
                    btn.innerHTML = textoOriginal;
                    console.error(erro);
                }
            });
        };
