<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mundoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body { font-family: sans-serif; background-color: #f8f9fa; }
        .navbar { background-color: #fff; border-bottom: 1px solid #eee; padding: 15px 0; }
        .hero { 
            background: #2c3e50; color: white; padding: 80px 20px; text-align: center; margin-bottom: 30px;
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1200');
            background-size: cover; background-position: center;
        }
        .search-box { background: white; padding: 10px; border-radius: 50px; display: flex; max-width: 600px; margin: 20px auto; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .search-input { border: none; outline: none; flex-grow: 1; padding: 10px 20px; font-size: 1.1rem; border-radius: 50px; }
        .search-btn { background: #f67123; color: white; border: none; padding: 10px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .search-btn:hover { background: #d95e16; }
        .filtros-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 40px; }
        .btn-nicho { background-color: white; border: 2px solid #00008b; color: #00008b; padding: 10px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .btn-nicho:hover, .btn-nicho.ativo { background-color: #00008b; color: white; transform: translateY(-3px); box-shadow: 0 5px 10px rgba(0,0,139,0.2); }
        .card-evento { transition: transform 0.2s; cursor: pointer; border: none; border-radius: 15px; overflow: hidden; }
        .card-evento:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card-img-top { height: 200px; object-fit: cover; }
        .badge-data { background: #f67123; color: white; font-size: 0.8em; padding: 5px 10px; border-radius: 5px; }
        .badge-categoria { background: #00008b; color: white; font-size: 0.8em; padding: 5px 10px; border-radius: 5px; }
        .btn-menu-azul { width: 45px; height: 45px; background-color: #00008b; color: white; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: background 0.3s; }
        .btn-menu-azul:hover { background-color: #00005c; color: white; }
        .dropdown-toggle::after { display: none; }
        .user-avatar-mini { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #f67123; }
        .btn-admin-link { background-color: #343a40; color: white; border-radius: 20px; padding: 8px 20px; font-size: 0.9em; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .btn-admin-link:hover { background-color: #23272b; color: white; transform: scale(1.05); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html" style="color: #f67123;">🌍 Mundoria</a>
            <div class="d-flex align-items-center gap-3" id="menu-usuario">
                </div>
        </div>
    </nav>

    <div class="hero">
        <h1 class="fw-bold display-5 mb-3">Explore o Autêntico</h1>
        <p class="lead mb-4">Descubra experiências únicas longe do turismo de massa.</p>
        <div class="search-box">
            <input type="text" id="input-busca" class="search-input" placeholder="Busque por locais..." onkeyup="aplicarFiltros()">
            <button class="search-btn"><i class="bi bi-search"></i></button>
        </div>
    </div>

    <div class="container mb-5">
        <div class="filtros-container">
            <button class="btn-nicho ativo" onclick="filtrarNicho('todos', this)">Todos</button>
            <button class="btn-nicho" onclick="filtrarNicho('Restaurante', this)"><i class="bi bi-cup-hot"></i> Gastronomia</button>
            <button class="btn-nicho" onclick="filtrarNicho('Parque', this)"><i class="bi bi-tree"></i> Natureza</button>
            <button class="btn-nicho" onclick="filtrarNicho('Museu', this)"><i class="bi bi-bank"></i> Cultura</button>
            <button class="btn-nicho" onclick="filtrarNicho('Feira', this)"><i class="bi bi-shop"></i> Feiras</button>
        </div>
        <h3 class="text-muted mb-4 border-bottom pb-2">Resultados da Busca</h3>
        <div id="grade-conteudo" class="row">
            <p class="text-center">Carregando experiências...</p>
        </div>
    </div>

    <div class="modal fade" id="modalAddRoteiro" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Adicionar ao Roteiro</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Escolha em qual roteiro você quer salvar este local:</p>
                    <select class="form-select mb-3" id="select-roteiros">
                        <option selected disabled>Carregando seus roteiros...</option>
                    </select>
                    <input type="hidden" id="id-local-temp">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="window.confirmarAdicaoRoteiro()">Salvar no Roteiro</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, query, where, addDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDGDvRBfJlztDRpQS1MHkYlDQst7ZtfHCo",
        authDomain: "mundoria-53de5.firebaseapp.com",
        projectId: "mundoria-53de5",
        storageBucket: "mundoria-53de5.firebasestorage.app",
        messagingSenderId: "86901345396",
        appId: "1:86901345396:web:969fa3637292d0333e1521"
    };

    const appFirebase = initializeApp(firebaseConfig);
    const dbFirebase = getFirestore(appFirebase);
    const authFirebase = getAuth(appFirebase);

    window.dbFirebase = dbFirebase;
    window.collectionFirebase = collection;
    window.getDocsFirebase = getDocs;

    const menu = document.getElementById('menu-usuario');

    onAuthStateChanged(authFirebase, async (user) => {
        if (user) {
            window.isLogado = true;
            const emailId = user.email.toLowerCase();
            const userSnap = await getDoc(doc(dbFirebase, "users", emailId));
            
            const data = userSnap.exists() ? userSnap.data() : { 
                nome: "Usuário", 
                foto: "https://cdn-icons-png.flaticon.com/512/847/847969.png", 
                tipo: "turista" 
            };
            
            window.usuarioGlobal = { id: emailId, ...data };

            if (data.tipo === 'admin') {
                menu.innerHTML = `
                    <a href="painel_admin.html" class="btn-admin-link"><i class="bi bi-gear-fill"></i> Painel Administrativo</a>
                    <a href="perfil.html" class="text-decoration-none d-flex align-items-center gap-2 text-dark">
                        <img src="${data.foto}" class="user-avatar-mini">
                        <span class="fw-bold d-none d-md-block">${data.nome}</span>
                    </a>
                    <button class="btn btn-outline-danger btn-sm ms-2" id="btn-sair">Sair</button>
                `;
            } else {
                let badgeTipo = '';
                if (data.tipo === 'produtor') {
                    badgeTipo = `<li><hr class="dropdown-divider"></li><li><span class="dropdown-item-text text-success fw-bold"><i class="bi bi-star-fill"></i> Você é Produtor</span></li>`;
                } else if (data.tipo === 'parceiro') {
                    badgeTipo = `<li><hr class="dropdown-divider"></li><li><span class="dropdown-item-text text-primary fw-bold"><i class="bi bi-shop"></i> Você é Parceiro</span></li>`;
                } else {
                    badgeTipo = `<li><hr class="dropdown-divider"></li><li><a class="dropdown-item fw-bold text-warning" href="planos.html">⭐ Seja Parceiro</a></li>`;
                }

                menu.innerHTML = `
                    <a href="perfil.html" class="text-decoration-none d-flex align-items-center gap-2 text-dark">
                        <img src="${data.foto}" class="user-avatar-mini">
                        <span class="fw-bold d-none d-md-block">${data.nome}</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn-menu-azul dropdown-toggle" type="button" data-bs-toggle="dropdown"><i class="bi bi-list"></i></button>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 p-3">
                            <li><h6 class="dropdown-header">Menu</h6></li>
                            <li><a class="dropdown-item" href="meu_painel.html"><i class="bi bi-grid-fill me-2"></i> Meu Painel</a></li>
                            ${badgeTipo}
                            <li><hr class="dropdown-divider"></li>
                            <li><button class="dropdown-item text-danger" id="btn-sair">Sair</button></li>
                        </ul>
                    </div>`;
            }
            
            document.getElementById('btn-sair').addEventListener('click', () => {
                if(confirm('Deseja realmente sair?')) {
                    signOut(authFirebase).then(() => location.reload());
                }
            });

        } else {
            window.isLogado = false;
            window.usuarioGlobal = null;
            menu.innerHTML = `
                <a href="login.html" class="btn btn-outline-secondary btn-sm me-2">Login</a>
                <a href="cadastro.html" class="btn btn-primary btn-sm" style="background:#f67123; border:none;">Cadastre-se</a>
            `;
        }
        carregarLocais();
    });

    // --- FUNÇÕES DE ROTEIRO (MUDANÇA AQUI) ---

    window.abrirModalRoteiro = async (idLocal) => {
        if(!window.isLogado) {
            alert("Faça login para adicionar ao roteiro!");
            window.location.href = 'login.html';
            return;
        }

        document.getElementById('id-local-temp').value = idLocal;
        const select = document.getElementById('select-roteiros');
        select.innerHTML = '<option value="">Buscando seus roteiros...</option>';

        const modal = new bootstrap.Modal(document.getElementById('modalAddRoteiro'));
        modal.show();

        try {
            // Busca apenas os roteiros do usuário logado (usando o email como ID)
            const q = query(collection(dbFirebase, "roteiros"), where("id_usuario", "==", window.usuarioGlobal.id));
            const snap = await getDocs(q);

            if (snap.empty) {
                select.innerHTML = '<option value="">Você não tem roteiros. Crie um no Painel!</option>';
                return;
            }

            select.innerHTML = '<option value="" selected disabled>Escolha um roteiro...</option>';
            snap.forEach(doc => {
                select.innerHTML += `<option value="${doc.id}">${doc.data().nome_roteiro}</option>`;
            });
        } catch (e) {
            console.error(e);
            select.innerHTML = '<option>Erro ao carregar roteiros.</option>';
        }
    };

    window.confirmarAdicaoRoteiro = async () => {
        const idRoteiro = document.getElementById('select-roteiros').value;
        const idLocal = document.getElementById('id-local-temp').value;

        if (!idRoteiro) return alert("Selecione um roteiro da lista!");

        try {
            await addDoc(collection(dbFirebase, "roteiro_itens"), {
                id_roteiro: idRoteiro,
                id_local: idLocal,
                horario: "" // Fica vazio para o usuário definir no painel depois
            });
            alert("Local adicionado com sucesso ao seu roteiro!");
            bootstrap.Modal.getInstance(document.getElementById('modalAddRoteiro')).hide();
        } catch (e) {
            console.error(e);
            alert("Erro ao salvar local no roteiro.");
        }
    };
</script>

<script>
    let locaisGlobais = [];
    let filtroAtual = 'todos';

    async function carregarLocais() {
        try {
            const snap = await window.getDocsFirebase(
                window.collectionFirebase(window.dbFirebase, "locais")
            );
            locaisGlobais = [];
            snap.forEach((doc) => {
                locaisGlobais.push({ id: doc.id, ...doc.data() });
            });
            renderizarLocais(locaisGlobais);
        } catch (erro) {
            console.error("Erro ao carregar locais:", erro);
        }
    }

    function renderizarLocais(lista) {
        const div = document.getElementById('grade-conteudo');
        div.innerHTML = lista.length === 0 ? '<div class="col-12 text-center text-muted py-5"><h4>Nenhum local encontrado.</h4></div>' : '';
        
        lista.forEach(item => {
            let etiqueta = item.tipo_local === 'evento' ? `📅 ${item.data_evento}` : `📍 ${item.categoria}`;
            let botoesAcao = (window.usuarioGlobal && window.usuarioGlobal.tipo === 'admin') 
                ? `<a href="detalhes.html?id=${item.id}" class="btn btn-primary w-100 btn-sm fw-bold">Ver Detalhes (Admin)</a>`
                : `<button class="btn btn-outline-success w-50 btn-sm fw-bold" onclick="window.abrirModalRoteiro('${item.id}')">+ Roteiro</button>
                   <a href="detalhes.html?id=${item.id}" class="btn btn-primary w-50 btn-sm fw-bold">Detalhes</a>`;

            div.innerHTML += `
                <div class="col-md-4 mb-4">
                    <div class="card card-evento h-100 shadow-sm">
                        <img src="${item.imagem}" class="card-img-top">
                        <div class="card-body d-flex flex-column">
                            <div>
                                <span class="badge-categoria mb-2 d-inline-block">${etiqueta}</span>
                                <h5 class="card-title fw-bold mt-2">${item.nome}</h5>
                                <p class="card-text text-secondary small">${item.descricao.substring(0, 80)}...</p>
                            </div>
                            <div class="mt-auto pt-3 d-flex gap-2">${botoesAcao}</div>
                        </div>
                    </div>
                </div>`;
        });
    }

    function aplicarFiltros() {
        const termo = document.getElementById('input-busca').value.toLowerCase();
        const filtrados = locaisGlobais.filter(item => {
            const bateNicho = (filtroAtual === 'todos') || (item.categoria === filtroAtual);
            const bateTexto = item.nome.toLowerCase().includes(termo) || item.descricao.toLowerCase().includes(termo);
            return bateNicho && bateTexto;
        });
        renderizarLocais(filtrados);
    }

    function filtrarNicho(c, b) {
        filtroAtual = c;
        document.querySelectorAll('.btn-nicho').forEach(btn => btn.classList.remove('ativo'));
        b.classList.add('ativo');
        aplicarFiltros();
    }
</script>
</body>
</html>
