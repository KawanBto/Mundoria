<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Mundoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f67123; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card-login { background: white; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .btn-azul { background: #00008b; color: white; width: 100%; font-weight: bold; padding: 10px; border: none; border-radius: 5px; }
        .btn-azul:hover { background: #00005c; }
        .form-check-input:checked { background-color: #f67123; border-color: #f67123; }
    </style>
</head>
<body>
    <div class="card-login text-center">
        <h2 class="mb-4 fw-bold text-dark">Login</h2>
        
        <form id="form-login">
            <div class="mb-3 text-start">
                <label class="form-label fw-bold">E-mail</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            
            <div class="mb-2 text-start">
                <label class="form-label fw-bold">Senha</label>
                <input type="password" name="senha" id="senha" class="form-control" required>
            </div>

            <div class="mb-4 text-start form-check">
                <input type="checkbox" class="form-check-input" id="check-mostrar">
                <label class="form-check-label small" for="check-mostrar">Exibir senha</label>
            </div>
            
            <button type="submit" class="btn btn-azul mb-3">ACESSAR</button>
        </form>

        <p class="small">Não tem uma conta? <a href="cadastro.html" class="fw-bold text-decoration-none" style="color: #f67123;">CADASTRE-SE</a></p>
        <a href="index.html" class="small text-muted text-decoration-none">Voltar para Home</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDGDvRBfJlztDRpQS1MHkYlDQst7ZtfHCo",
            authDomain: "mundoria-53de5.firebaseapp.com",
            projectId: "mundoria-53de5",
            storageBucket: "mundoria-53de5.firebasestorage.app",
            messagingSenderId: "86901345396",
            appId: "1:86901345396:web:969fa3637292d0333e1521"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('check-mostrar').addEventListener('change', function() {
            document.getElementById('senha').type = this.checked ? "text" : "password";
        });

        const formLogin = document.getElementById('form-login');
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = formLogin.email.value;
            const senha = formLogin.senha.value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, senha);
                const user = userCredential.user;

                // Busca o documento pelo email em minúsculo [cite: 20, 208]
                const userSnap = await getDoc(doc(db, "users", user.email.toLowerCase()));
                
                if (userSnap.exists()) {
                    const dados = userSnap.data();
                    
                    // DEBUG: Veja no console o que está vindo do banco!
                    console.log("Usuário logado:", dados.nome);
                    console.log("Tipo detectado:", dados.tipo);

                    alert("Bem-vindo, " + dados.nome + "!");

                    // REDIRECIONAMENTO RÍGIDO [cite: 209, 210, 211]
                    if (dados.tipo === 'admin') {
                        window.location.href = "painel_admin.html";
                    } else if (dados.tipo === 'produtor') {
                        // Força o redirecionamento para o painel escuro de gestão
                        window.location.href = "painel.html";
                    } else if (dados.tipo === 'analista') {
                        window.location.href = "painel_analista.html";
                    } else {
                        // Turistas e Parceiros caem aqui
                        window.location.href = "meu_painel.html";
                    }
                } else {
                    window.location.href = "meu_painel.html";
                }
            } catch (error) {
                console.error("Erro no login:", error.code);
                alert("E-mail ou senha incorretos.");
            }
        });
    </script>
</body>
</html>
