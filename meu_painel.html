<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Painel - Mundoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    
    <style>
        :root { --laranja-mundoria: #f67123; --azul-abas: #00008b; }
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .navbar { background-color: #fff; border-bottom: 1px solid #eee; padding: 15px 0; }
        .painel-header-bg { background-color: var(--laranja-mundoria); padding: 40px 20px 0 20px; color: white; border-radius: 0 0 15px 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .nav-tabs { border-bottom: none; gap: 5px; }
        .nav-link { background-color: rgba(255,255,255,0.8); color: var(--azul-abas); font-weight: bold; border: none; border-radius: 15px 15px 0 0 !important; padding: 12px 30px; }
        .nav-link.active { background-color: var(--azul-abas) !important; color: white !important; }
        
        .card-wrapper { background: white; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 20px; border-left: 5px solid var(--laranja-mundoria); cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 15px; text-decoration: none; color: inherit; position: relative; }
        .card-wrapper:hover { transform: translateX(5px); }
        
        .area-detalhes-roteiro { display: none; background: #fff; border: 1px solid #eee; border-top: none; margin-top: -15px; margin-bottom: 20px; border-radius: 0 0 15px 15px; padding: 20px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); }
        .item-local-lista { background: #f9f9f9; padding: 10px; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; border: 1px solid #eee; transition: 0.3s; flex-wrap: wrap; }
        .conflito-tempo { border: 2px solid #dc3545 !important; background: #fff5f5; }

        .user-avatar-mini { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        .img-roteiro-capa { width: 80px; height: 60px; border-radius: 10px; object-fit: cover; }
        
        .btn-edit-foto-roteiro { position: absolute; left: 75px; top: 15px; background: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; z-index: 10; }
        
        .d-none { display: none !important; }
        #preview-crop { max-width: 100%; display: block; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <div class="d-flex align-items-center gap-3">
                <a class="navbar-brand fw-bold fs-3" href="index.html" style="color: #f67123;">🌍 Mundoria</a>
                <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-arrow-left"></i> Voltar</a>
            </div>
            <div class="d-flex align-items-center gap-3" id="header-user-area"></div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="painel-header-bg">
            <div class="d-flex justify-content-between align-items-end">
                <div>
                    <h1 class="fw-bold">Meu Painel</h1>
                    <p class="opacity-75" id="texto-saudacao">Carregando...</p>
                </div>
                <ul class="nav nav-tabs" id="myTab" role="tablist">
                    <li class="nav-item"><button class="nav-link active" data-bs-target="#favoritos" data-bs-toggle="tab">Favoritos</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-target="#roteiros" data-bs-toggle="tab">Roteiros</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-target="#avaliacoes" data-bs-toggle="tab">Minhas Avaliações</button></li>
                </ul>
            </div>
        </div>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="favoritos">
                <div id="lista-favoritos"><p class="text-center py-5">Carregando favoritos...</p></div>
            </div>

            <div class="tab-pane fade" id="roteiros">
                <div class="d-flex justify-content-between mb-3 align-items-center bg-white p-3 rounded shadow-sm">
                    <h4 class="m-0 text-primary">Meus Roteiros</h4>
                    <button class="btn btn-primary rounded-pill fw-bold" data-bs-toggle="modal" data-bs-target="#modalNovoRoteiro">+ Novo Roteiro</button>
                </div>
                <div id="lista-roteiros"></div>
            </div>
            
            <div class="tab-pane fade" id="avaliacoes">
                <div id="lista-minhas-avaliacoes" class="p-3">Carregando avaliações...</div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalNovoRoteiro" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5>Criar Roteiro</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body"><input type="text" id="input-nome-roteiro" class="form-control" placeholder="Nome do roteiro"></div>
                <div class="modal-footer"><button class="btn btn-primary" id="btn-confirmar-roteiro">Salvar</button></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalCropRoteiro" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5>Ajustar Foto do Roteiro</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body"><img id="preview-crop"></div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" id="btn-salvar-crop">Salvar Foto</button>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="input-file-roteiro" accept="image/*" class="d-none">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDGDvRBfJlztDRpQS1MHkYlDQst7ZtfHCo",
            authDomain: "mundoria-53de5.firebaseapp.com",
            projectId: "mundoria-53de5",
            storageBucket: "mundoria-53de5.firebasestorage.app",
            messagingSenderId: "86901345396",
            appId: "1:86901345396:web:969fa3637292d0333e1521"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);

        let cropper;
        let idRoteiroAtualFoto = "";

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const email = user.email.toLowerCase();
            const userSnap = await getDoc(doc(db, "users", email));
            if (userSnap.exists()) {
                atualizarInterface(userSnap.data(), auth);
                carregarFavoritos(email);
                carregarAvaliacoes(email); // Função atualizada abaixo
                carregarRoteiros(email);
            }
        });

        // --- ROTEIROS ---

        async function carregarRoteiros(email) {
            const q = query(collection(db, "roteiros"), where("id_usuario", "==", email));
            const snap = await getDocs(q);
            const container = document.getElementById('lista-roteiros');
            container.innerHTML = snap.empty ? '<p class="text-center py-5 text-muted">Sem roteiros.</p>' : "";

            snap.forEach(docSnap => {
                const r = docSnap.data();
                const id = docSnap.id;
                container.innerHTML += `
                    <div class="card-wrapper" onclick="window.toggleRoteiro('${id}', event)">
                        <div class="btn-edit-foto-roteiro" onclick="window.triggerTrocaFoto('${id}', event)">
                            <i class="bi bi-camera"></i>
                        </div>
                        <img src="${r.foto_capa}" class="img-roteiro-capa">
                        <div class="flex-grow-1">
                            <h5 class="m-0 fw-bold">${r.nome_roteiro}</h5>
                            <small class="text-muted">Criado em ${r.data_criacao}</small>
                        </div>
                        <i class="bi bi-trash text-danger fs-5 me-2" onclick="window.removerRoteiroCompleto('${id}', event)"></i>
                        <i class="bi bi-chevron-down fs-4 text-muted"></i>
                    </div>
                    <div id="detalhes-${id}" class="area-detalhes-roteiro"></div>
                `;
            });
        }

        window.toggleRoteiro = async (id, event) => {
            if(event.target.closest('.btn-edit-foto-roteiro') || event.target.closest('.bi-trash')) return;
            const div = document.getElementById(`detalhes-${id}`);
            if (div.style.display === "block") { 
                div.style.display = "none"; 
            } else { 
                div.style.display = "block"; 
                await window.atualizarConteudoRoteiro(id); 
            }
        };

        window.atualizarConteudoRoteiro = async (idRoteiro) => {
            const div = document.getElementById(`detalhes-${idRoteiro}`);
            div.innerHTML = "Carregando...";

            const q = query(collection(db, "roteiro_itens"), where("id_roteiro", "==", idRoteiro));
            const snap = await getDocs(q);
            if (snap.empty) { div.innerHTML = "Nenhum local."; return; }

            let lista = [];
            for (const d of snap.docs) {
                const item = d.data();
                const localDoc = await getDoc(doc(db, "locais", item.id_local));
                lista.push({ idItem: d.id, idLocal: item.id_local, ...item, info: localDoc.data() });
            }

            lista.sort((a, b) => {
                const dataA = a.data_item || "9999-99-99";
                const dataB = b.data_item || "9999-99-99";
                if (dataA !== dataB) return dataA.localeCompare(dataB);
                return (a.horario || "99:99").localeCompare(b.horario || "99:99");
            });

            div.innerHTML = "";
            lista.forEach((it, idx) => {
                let erroTime = "";
                let classeErro = "";
                if (idx > 0 && it.horario && lista[idx-1].horario && it.data_item === lista[idx-1].data_item) {
                    const [h1, m1] = lista[idx-1].horario.split(':').map(Number);
                    const [h2, m2] = it.horario.split(':').map(Number);
                    const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
                    if (diff < 30) { 
                        erroTime = "<br><small class='text-danger fw-bold'><i class='bi bi-exclamation-triangle'></i> Intervalo < 30min!</small>"; 
                        classeErro = "conflito-tempo"; 
                    }
                }

                div.innerHTML += `
                    <div class="item-local-lista ${classeErro}">
                        <a href="detalhes.html?id=${it.idLocal}" class="d-flex align-items-center gap-2 text-decoration-none text-dark flex-grow-1">
                            <img src="${it.info.imagem}" style="width:40px; height:40px; border-radius:5px; object-fit:cover;">
                            <div>
                                <strong style="color: var(--azul-abas)">${it.info.nome}</strong>
                                ${erroTime}
                            </div>
                        </a>
                        <div class="d-flex gap-1 align-items-center">
                            <input type="date" class="form-control w-auto form-control-sm" value="${it.data_item || ''}" 
                                   onchange="window.salvarDataFirebase('${it.idItem}', this.value, '${idRoteiro}')">
                            <input type="time" class="form-control w-auto form-control-sm" value="${it.horario || ''}" 
                                   onchange="window.salvarHoraFirebase('${it.idItem}', this.value, '${idRoteiro}')">
                            <i class="bi bi-trash text-danger ms-2" style="cursor:pointer" onclick="window.removerItemFirebase('${it.idItem}', '${idRoteiro}')"></i>
                        </div>
                    </div>`;
            });
        };

        window.removerRoteiroCompleto = async (id, event) => {
            event.stopPropagation();
            if(!confirm("Excluir este roteiro?")) return;
            const q = query(collection(db, "roteiro_itens"), where("id_roteiro", "==", id));
            const snap = await getDocs(q);
            for (const docIt of snap.docs) { await deleteDoc(docIt.ref); }
            await deleteDoc(doc(db, "roteiros", id));
            location.reload();
        };

        window.salvarHoraFirebase = async (idItem, hora, idRoteiro) => {
            await updateDoc(doc(db, "roteiro_itens", idItem), { horario: hora });
            await window.atualizarConteudoRoteiro(idRoteiro);
        };

        window.salvarDataFirebase = async (idItem, data, idRoteiro) => {
            await updateDoc(doc(db, "roteiro_itens", idItem), { data_item: data });
            await window.atualizarConteudoRoteiro(idRoteiro);
        };

        window.removerItemFirebase = async (idItem, idRoteiro) => {
            if(confirm("Remover local?")) {
                await deleteDoc(doc(db, "roteiro_itens", idItem));
                await window.atualizarConteudoRoteiro(idRoteiro);
            }
        };

        // --- CROPPER ---
        window.triggerTrocaFoto = (id, event) => {
            event.stopPropagation();
            idRoteiroAtualFoto = id;
            document.getElementById('input-file-roteiro').click();
        };

        document.getElementById('input-file-roteiro').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = () => {
                const img = document.getElementById('preview-crop');
                img.src = reader.result;
                new bootstrap.Modal(document.getElementById('modalCropRoteiro')).show();
                if (cropper) cropper.destroy();
                cropper = new Cropper(img, { aspectRatio: 4 / 3, viewMode: 1 });
            };
            reader.readAsDataURL(file);
        };

        document.getElementById('btn-salvar-crop').onclick = async () => {
            const canvas = cropper.getCroppedCanvas({ width: 400, height: 300 });
            canvas.toBlob(async (blob) => {
                const storageRef = ref(storage, `roteiros/${idRoteiroAtualFoto}.jpg`);
                await uploadBytes(storageRef, blob);
                const url = await getDownloadURL(storageRef);
                await updateDoc(doc(db, "roteiros", idRoteiroAtualFoto), { foto_capa: url });
                location.reload();
            }, 'image/jpeg');
        };

        // --- OUTRAS FUNÇÕES ---

        document.getElementById('btn-confirmar-roteiro').onclick = async () => {
            const nome = document.getElementById('input-nome-roteiro').value;
            if (!nome) return alert("Dê um nome!");
            await addDoc(collection(db, "roteiros"), {
                id_usuario: auth.currentUser.email.toLowerCase(),
                nome_roteiro: nome,
                data_criacao: new Date().toLocaleDateString('pt-BR'),
                foto_capa: "https://images.unsplash.com/photo-1488646953014-85cb44e25828?q=80&w=1000"
            });
            location.reload();
        };

        async function carregarFavoritos(email) {
            const q = query(collection(db, "favoritos"), where("id_usuario", "==", email));
            const snap = await getDocs(q);
            const div = document.getElementById('lista-favoritos');
            if (snap.empty) { div.innerHTML = "Nenhum favorito."; return; }
            div.innerHTML = "";
            snap.forEach(d => {
                const f = d.data();
                div.innerHTML += `<a href="detalhes.html?id=${f.id_local}" class="card-wrapper"><img src="${f.imagem}" style="width:60px; height:60px; object-fit:cover; border-radius:10px;"><div><h6 class="m-0">${f.nome_local}</h6></div></a>`;
            });
        }

        // 🔥 FUNÇÃO ATUALIZADA: MINHAS AVALIAÇÕES BONITINHAS
        async function carregarAvaliacoes(email) {
            const q = query(collection(db, "avaliacoes"), where("id_usuario", "==", email));
            const snap = await getDocs(q);
            const div = document.getElementById('lista-minhas-avaliacoes');
            if (snap.empty) { div.innerHTML = "Você ainda não avaliou nada."; return; }
            
            div.innerHTML = "Carregando...";
            let html = "";
            
            for (const d of snap.docs) {
                const c = d.data();
                const localDoc = await getDoc(doc(db, "locais", c.id_local));
                const info = localDoc.exists() ? localDoc.data() : { nome: "Local Removido", imagem: "https://via.placeholder.com/150" };

                html += `
                    <a href="detalhes.html?id=${c.id_local}" class="card-wrapper d-flex align-items-center gap-3">
                        <img src="${info.imagem}" style="width:70px; height:70px; object-fit:cover; border-radius:10px;">
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between">
                                <h6 class="m-0 fw-bold" style="color: var(--azul-abas)">${info.nome}</h6>
                                <span class="text-warning fw-bold">${c.nota}★</span>
                            </div>
                            <p class="mb-0 mt-1 text-secondary italic small">"${c.comentario}"</p>
                        </div>
                        <i class="bi bi-chevron-right text-muted"></i>
                    </a>`;
            }
            div.innerHTML = html;
        }

        function atualizarInterface(u, auth) {
            document.getElementById('texto-saudacao').innerText = `Olá, ${u.nome}!`;
            document.getElementById('header-user-area').innerHTML = `<a href="perfil.html" class="text-dark fw-bold me-3 text-decoration-none d-flex align-items-center"><img src="${u.foto}" class="user-avatar-mini me-2">${u.nome}</a><button class="btn btn-sm btn-danger rounded-pill px-3" id="btn-sair">Sair</button>`;
            document.getElementById('btn-sair').onclick = () => signOut(auth).then(() => window.location.href = "index.html");
        }
    </script>
</body>
</html>
