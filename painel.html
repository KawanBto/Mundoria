<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Área do Produtor - Mundoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        /* Barra Lateral Escura (Diferente da laranja do turista) */
        .sidebar { background: #212529; min-height: 100vh; color: white; padding: 20px; position: sticky; top: 0; }
        .form-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .img-pendente { width: 80px; height: 55px; object-fit: cover; border-radius: 6px; border: 1px solid #eee; }
        .nav-link { color: rgba(255,255,255,0.7); transition: 0.2s; }
        .nav-link:hover { color: #f67123; }
        .nav-link.active { color: #f67123 !important; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="pt-3">
                    <h4 class="fw-bold mb-4">🌍 Mundoria</h4>
                    <hr>
                    <ul class="nav flex-column gap-2">
                        <li class="nav-item"><a href="index.html" class="nav-link"><i class="bi bi-house-door me-2"></i> Ir para o Site</a></li>
                        <li class="nav-item"><a href="#" class="nav-link active"><i class="bi bi-patch-check me-2"></i> Aprovações</a></li>
                        <li class="nav-item"><a href="meu_painel.html" class="nav-link"><i class="bi bi-person me-2"></i> Meu Painel Pessoal</a></li>
                    </ul>
                    <hr>
                    <button class="btn btn-sm btn-outline-danger w-100 mt-4" id="btn-sair-produtor">Sair do Sistema</button>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                    <h1 class="h2 fw-bold">Gestão de Conteúdo</h1>
                    <div id="badge-user" class="badge bg-dark p-2">Verificando acesso...</div>
                </div>

                <div class="form-box">
                    <h4 class="mb-4 text-primary"><i class="bi bi-clock-history"></i> Estabelecimentos Pendentes</h4>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Foto</th>
                                    <th>Estabelecimento</th>
                                    <th>Categoria</th>
                                    <th>Solicitante</th>
                                    <th class="text-end">Ação</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-pendentes">
                                <tr><td colspan="5" class="text-center py-5">Carregando lista de aprovação...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDGDvRBfJlztDRpQS1MHkYlDQst7ZtfHCo",
            authDomain: "mundoria-53de5.firebaseapp.com",
            projectId: "mundoria-53de5",
            storageBucket: "mundoria-53de5.firebasestorage.app",
            messagingSenderId: "86901345396",
            appId: "1:86901345396:web:969fa3637292d0333e1521"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // OBSERVA LOGIN E PERMISSÃO
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('badge-user').innerText = "Produtor: " + user.email;
                carregarLista();
            } else {
                window.location.href = "login.html";
            }
        });

        async function carregarLista() {
            const table = document.getElementById('tabela-pendentes');
            try {
                // Busca apenas locais com status pendente
                const q = query(collection(db, "locais"), where("status", "==", "pendente"));
                const snap = await getDocs(q);

                if (snap.empty) {
                    table.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted">🎉 Tudo em dia! Nenhuma solicitação pendente.</td></tr>';
                    return;
                }

                table.innerHTML = "";
                snap.forEach(d => {
                    const local = d.data();
                    table.innerHTML += `
                        <tr>
                            <td><img src="${local.imagem || 'https://via.placeholder.com/80'}" class="img-pendente"></td>
                            <td><div class="fw-bold">${local.nome}</div><small class="text-muted">${local.endereco}</small></td>
                            <td><span class="badge bg-info text-dark">${local.categoria}</span></td>
                            <td class="small">${local.id_parceiro}</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-success px-3 me-1 fw-bold" onclick="window.aprovar('${d.id}')">APROVAR</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="window.rejeitar('${d.id}')">REJEITAR</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) { console.error(e); }
        }

        window.aprovar = async (id) => {
            if(confirm("Confirmar entrada deste local no site?")) {
                await updateDoc(doc(db, "locais", id), { status: "ativo" });
                alert("Estabelecimento aprovado!");
                carregarLista();
            }
        };

        window.rejeitar = async (id) => {
            if(confirm("Deseja deletar essa solicitação?")) {
                await deleteDoc(doc(db, "locais", id));
                carregarLista();
            }
        };

        document.getElementById('btn-sair-produtor').onclick = () => {
            signOut(auth).then(() => window.location.href = "login.html");
        };
    </script>
</body>
</html>
