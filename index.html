<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Mundoria</title>
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            font-family: sans-serif;
            background-color: #f8f9fa;
        }

        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .hero {
            background: #2c3e50;
            color: white;
            padding: 100px 20px 120px 20px;
            /* Aumentado o padding inferior para dar respiro */
            text-align: center;
            margin-bottom: 50px;
            /* Aumentada a margem para afastar as categorias */
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1200');
            background-size: cover;
            background-position: center;
        }

        .search-box {
            background: white;
            padding: 8px 15px;
            /* Ajustado para não apertar os inputs */
            border-radius: 50px;
            display: flex;
            max-width: 850px;
            /* Levemente aumentada para comportar os dois campos */
            margin: 20px auto;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            /* Garante que nada saia das bordas arredondadas */
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .search-input {
            border: none;
            outline: none;
            flex-grow: 1;
            padding: 12px 15px;
            font-size: 1rem;
            width: 100%;
            /* Garante que o input ocupe o espaço interno */
        }

        .search-btn {
            background: #f67123;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-btn:hover {
            background: #d95e16;
        }

        .filtros-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .btn-nicho {
            background-color: white;
            border: 2px solid #00008b;
            color: #00008b;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-nicho:hover,
        .btn-nicho.ativo {
            background-color: #00008b;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(0, 0, 139, 0.2);
        }

        .card-evento {
            transition: transform 0.2s;
            cursor: pointer;
            border: none;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .card-evento:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .card-img-top {
            height: 200px;
            object-fit: cover;
        }

        .badge-data {
            background: #f67123;
            color: white;
            font-size: 0.8em;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .badge-categoria {
            background: #00008b;
            color: white;
            font-size: 0.8em;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .btn-menu-azul {
            width: 45px;
            height: 45px;
            background-color: #00008b;
            color: white;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-menu-azul:hover {
            background-color: #00005c;
            color: white;
        }

        .dropdown-toggle::after {
            display: none;
        }

        .user-avatar-mini {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #f67123;
        }

        .btn-admin-link {
            background-color: #343a40;
            color: white;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 0.9em;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
            border: none;
        }

        .btn-admin-link:hover {
            background-color: #23272b;
            color: white;
            transform: scale(1.05);
        }

        .btn-analista-link {
            background-color: #00008b;
            color: white;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 0.9em;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
            border: none;
        }

        .btn-analista-link:hover {
            background-color: #00005c;
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html" style="color: #f67123;">🌍 Mundoria</a>
            <div class="d-flex align-items-center gap-3" id="menu-usuario"></div>
        </div>
    </nav>

    <div class="hero">
        <h1 class="fw-bold display-5 mb-3">Explore o Autêntico</h1>
        <p class="lead mb-4">Descubra experiências únicas longe do turismo de massa.</p>

        <div class="search-box shadow-lg d-flex align-items-center p-2 mx-auto"
            style="max-width: 800px; border-radius: 50px; background: white;">
            <div class="d-flex align-items-center flex-grow-1 px-3 border-end">
                <i class="bi bi-search text-muted me-2"></i>
                <input type="text" id="input-busca" class="border-0 w-100 search-input" style="outline: none;"
                    placeholder="O que você procura?" onkeyup="aplicarFiltros()">
            </div>
            <div class="d-flex align-items-center flex-grow-1 px-3">
                <i class="bi bi-geo-alt text-laranja me-2"></i>
                <input type="text" id="input-localidade" class="border-0 w-100 search-input" style="outline: none;"
                    placeholder="Cidade, Bairro ou Estado (ex: SP)" onkeyup="aplicarFiltros()">
            </div>
            <button class="search-btn rounded-pill px-4 ms-2">Buscar</button>
        </div>

        <div class="d-flex justify-content-center gap-2 mt-3">
            <button class="btn btn-light btn-sm rounded-pill shadow-sm text-primary fw-bold"
                onclick="window.filtrarPorGps()">
                <i class="bi bi-geo-fill"></i> Locais Próximos (GPS)
            </button>
            <button class="btn btn-light btn-sm rounded-pill shadow-sm text-laranja fw-bold"
                onclick="window.filtrarPorEnderecoPerfil()">
                <i class="bi bi-house-heart-fill"></i> Perto da Minha Casa
            </button>
        </div>
    </div>

    <div class="container mb-5">
        <div class="container mt-4 mb-5">
            <div class="filtros-container d-flex justify-content-center gap-2 flex-wrap">
                <button class="btn-nicho ativo px-4 shadow-sm" onclick="filtrarNicho('todos', this)">✨ Todos</button>
                <button class="btn-nicho shadow-sm" onclick="filtrarNicho('Restaurante', this)"><i
                        class="bi bi-cup-hot"></i> Gastronomia</button>
                <button class="btn-nicho shadow-sm" onclick="filtrarNicho('Parque', this)"><i class="bi bi-tree"></i>
                    Natureza</button>
                <button class="btn-nicho shadow-sm" onclick="filtrarNicho('Museu', this)"><i class="bi bi-bank"></i>
                    Cultura</button>
                <button class="btn-nicho shadow-sm" onclick="filtrarNicho('Lazer', this)"><i
                        class="bi bi-controller"></i> Lazer</button>
                <button class="btn-nicho shadow-sm" onclick="filtrarNicho('Feira', this)"><i class="bi bi-shop"></i>
                    Feiras</button>
            </div>
        </div>

        <h3 class="text-muted mb-4 border-bottom pb-2">Resultados da Busca</h3>
        <div id="grade-conteudo" class="row">
            <p class="text-center">Carregando experiências...</p>
        </div>

        <div class="d-flex justify-content-center mt-4 mb-5" id="container-paginacao" style="display: none;">
            <nav aria-label="Navegação de páginas">
                <ul class="pagination id" id="lista-numeros-pagina">
                </ul>
            </nav>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <script type="module">
            // 1. Importa as configurações do arquivo oculto
            import { firebaseConfig } from './config.js';

            // 2. Imports do Firebase (ADICIONADOS: setDoc e addDoc para o funcionamento completo)
            import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
            import {
                getFirestore, collection, getDocs, doc, getDoc, setDoc, query, where, updateDoc,
                orderBy, limit, startAfter, addDoc
            } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
            import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

            // 3. Inicialização
            const appFirebase = initializeApp(firebaseConfig);
            const dbFirebase = getFirestore(appFirebase);
            const authFirebase = getAuth(appFirebase);

            // 4. Pontes para o sistema (ADICIONADAS as funções de escrita e leitura individual)
            window.dbFirebase = dbFirebase;
            window.collectionFirebase = collection;
            window.getDocsFirebase = getDocs;
            window.queryFirebase = query;
            window.whereFirebase = where;

            // Pontes essenciais para a carga e manipulação de documentos
            window.doc = doc;
            window.getDoc = getDoc;
            window.setDoc = setDoc;
            window.updateDoc = updateDoc;
            window.addDoc = addDoc;

            // Novas pontes para filtros e paginação
            window.orderByFirebase = orderBy;
            window.limitFirebase = limit;
            window.startAfterFirebase = startAfter;

            const menu = document.getElementById('menu-usuario');
            onAuthStateChanged(authFirebase, async (user) => {
                if (user) {
                    window.isLogado = true;
                    const emailId = user.email.toLowerCase();
                    const userSnap = await getDoc(doc(dbFirebase, "users", emailId));

                    const data = userSnap.exists() ? userSnap.data() : {
                        nome: "Usuário",
                        foto: "https://cdn-icons-png.flaticon.com/512/847/847969.png",
                        tipo: "turista"
                    };

                    window.usuarioGlobal = { id: emailId, ...data };

                    if (data.tipo === 'admin' || data.tipo === 'produtor' || data.tipo === 'analista') {
                        let linkPainel = '';
                        let textoBotao = 'Painel de Gestão';
                        let classeBotao = 'btn-admin-link';
                        let icone = 'bi-gear-fill';

                        if (data.tipo === 'admin') {
                            linkPainel = 'painel_admin.html';
                        } else if (data.tipo === 'produtor') {
                            linkPainel = 'painel.html';
                        } else if (data.tipo === 'analista') {
                            linkPainel = 'painel_analista.html';
                            textoBotao = 'Relatórios BI';
                            classeBotao = 'btn-analista-link';
                            icone = 'bi-bar-chart-line-fill';
                        }

                        menu.innerHTML = `
                    <a href="${linkPainel}" class="${classeBotao}"><i class="bi ${icone}"></i> ${textoBotao}</a>
                    <a href="perfil.html" class="text-decoration-none d-flex align-items-center gap-2 text-dark">
                        <img src="${data.foto}" class="user-avatar-mini">
                        <span class="fw-bold d-none d-md-block">${data.nome}</span>
                    </a>
                    <button class="btn btn-outline-danger btn-sm ms-2" id="btn-sair">Sair</button>
                `;
                    } else {
                        let badgeTipo = '';
                        if (data.tipo === 'parceiro') {
                            badgeTipo = `
                        <li><hr class="dropdown-divider"></li>
                        <li><span class="dropdown-item-text text-primary fw-bold"><i class="bi bi-shop"></i> Você é Parceiro</span></li>
                        <li><button class="dropdown-item text-secondary small" onclick="window.cancelarAssinatura()"><i class="bi bi-x-circle me-2"></i> Cancelar Assinatura</button></li>
                    `;
                        } else {
                            badgeTipo = `<li><hr class="dropdown-divider"></li><li><a class="dropdown-item fw-bold text-warning" href="planos.html">⭐ Seja Parceiro</a></li>`;
                        }

                        menu.innerHTML = `
                    <a href="perfil.html" class="text-decoration-none d-flex align-items-center gap-2 text-dark">
                        <img src="${data.foto}" class="user-avatar-mini">
                        <span class="fw-bold d-none d-md-block">${data.nome}</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn-menu-azul dropdown-toggle" type="button" data-bs-toggle="dropdown"><i class="bi bi-list"></i></button>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 p-3">
                            <li><h6 class="dropdown-header">Menu</h6></li>
                            <li><a class="dropdown-item" href="meu_painel.html"><i class="bi bi-grid-fill me-2"></i> Meu Painel</a></li>
                            ${badgeTipo}
                            <li><hr class="dropdown-divider"></li>
                            <li><button class="dropdown-item text-danger" id="btn-sair">Sair</button></li>
                        </ul>
                    </div>`;
                    }

                    document.getElementById('btn-sair').addEventListener('click', () => {
                        if (confirm('Deseja realmente sair?')) {
                            signOut(authFirebase).then(() => location.reload());
                        }
                    });
                } else {
                    window.isLogado = false;
                    window.usuarioGlobal = null;
                    menu.innerHTML = `
                <a href="login.html" class="btn btn-outline-secondary btn-sm me-2">Login</a>
                <a href="cadastro.html" class="btn btn-primary btn-sm" style="background:#f67123; border:none;">Cadastre-se</a>
            `;
                }
                carregarLocais();
            });

            // Função para cancelar assinatura (Voltar a ser Turista)
            // Função para cancelar assinatura (Voltar a ser Turista e Desativar Locais)
            // Função ATUALIZADA: Cancela assinatura e DESATIVA os locais usando o campo correto 'id_parceiro'
            window.cancelarAssinatura = async () => {
                if (confirm("Tem certeza que deseja cancelar sua assinatura? Seus estabelecimentos cadastrados serão DESATIVADOS e você voltará a ser um Turista comum.")) {
                    try {
                        const userEmail = window.usuarioGlobal.id;
                        const userRef = doc(dbFirebase, "users", userEmail);

                        // 1. Volta o usuário para o tipo Turista
                        await updateDoc(userRef, { tipo: "turista" });

                        // 2. Busca todos os locais onde o 'id_parceiro' é o e-mail do usuário
                        // Conforme imagem do banco de dados, o campo correto é id_parceiro
                        const locaisRef = collection(dbFirebase, "locais");
                        const qLocais = query(locaisRef, where("id_parceiro", "==", userEmail));
                        const snapLocais = await getDocs(qLocais);

                        if (!snapLocais.empty) {
                            const batchPromessas = [];
                            snapLocais.forEach((docLocal) => {
                                const refLocal = doc(dbFirebase, "locais", docLocal.id);
                                // 3. Muda o status para 'desativado' para que suma do index.html
                                batchPromessas.push(updateDoc(refLocal, { status: "desativado" }));
                            });

                            // Aguarda a atualização de todos os estabelecimentos
                            await Promise.all(batchPromessas);
                            alert("Assinatura cancelada! Seus estabelecimentos foram retirados do ar.");
                        } else {
                            alert("Assinatura cancelada com sucesso!");
                        }

                        // 4. Recarrega para atualizar a interface
                        location.reload();
                    } catch (e) {
                        console.error("Erro ao cancelar:", e);
                        alert("Erro ao processar o cancelamento da assinatura.");
                    }
                }
            };

            // 5. Funções do Roteiro (Vinculadas ao window para funcionar com onclick no HTML)
            window.abrirModalRoteiro = async (idLocal, event) => {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                if (!window.isLogado || !window.usuarioGlobal) {
                    alert("Faça login para adicionar ao roteiro!");
                    window.location.href = 'login.html';
                    return;
                }

                // Armazena o ID do local no campo oculto do HTML [cite: 433]
                document.getElementById('id-local-temp').value = idLocal;
                const select = document.getElementById('select-roteiros');
                select.innerHTML = '<option value="">Buscando seus roteiros...</option>';

                const modalElement = document.getElementById('modalAddRoteiro');
                const modal = new bootstrap.Modal(modalElement);
                modal.show();

                try {
                    // Busca os roteiros do usuário logado [cite: 435]
                    const q = window.queryFirebase(
                        window.collectionFirebase(window.dbFirebase, "roteiros"),
                        window.whereFirebase("id_usuario", "==", window.usuarioGlobal.id)
                    );
                    const snap = await window.getDocsFirebase(q);

                    if (snap.empty) {
                        select.innerHTML = '<option value="">Você não tem roteiros. Crie um no Painel!</option>';
                        return;
                    }

                    select.innerHTML = '<option value="" selected disabled>Escolha um roteiro...</option>';
                    snap.forEach(doc => {
                        select.innerHTML += `<option value="${doc.id}">${doc.data().nome_roteiro}</option>`;
                    });
                } catch (e) {
                    console.error("Erro ao carregar roteiros:", e);
                    select.innerHTML = '<option>Erro ao carregar roteiros.</option>';
                }
            };

            window.confirmarAdicaoRoteiro = async () => {
                const idRoteiro = document.getElementById('select-roteiros').value;
                const idLocal = document.getElementById('id-local-temp').value;

                if (!idRoteiro) return alert("Selecione um roteiro da lista!");

                try {
                    // Grava o item no roteiro usando a ponte addDoc criada anteriormente [cite: 443]
                    await window.addDoc(window.collectionFirebase(window.dbFirebase, "roteiro_itens"), {
                        id_roteiro: idRoteiro,
                        id_local: idLocal,
                        horario: ""
                    });

                    alert("Local adicionado com sucesso ao seu roteiro!");
                    bootstrap.Modal.getInstance(document.getElementById('modalAddRoteiro')).hide();
                } catch (e) {
                    console.error("Erro ao salvar local no roteiro:", e);
                    alert("Erro ao salvar local no roteiro.");
                }
            };
        </script>

        <script>
            let locaisGlobais = [];
            let locaisFiltrados = []; // Mantém os locais que passaram pelos filtros para calcular a paginação
            let filtroAtual = 'todos';
            let limitePorPagina = 20; // Define o limite de 20 por página
            let paginaAtual = 1;     // Rastreia qual página numérica está ativa no momento

            // ATUALIZAÇÃO: Tabela de mapeamento para filtros consistentes
            const mapaCategorias = {
                'Restaurante': ['Restaurante', 'Bar', 'Café', 'Cafeteria', 'Lanchonete', 'Padaria', 'Gastronomia'],
                'Parque': ['Parque', 'Trilha', 'Mirante', 'Natureza', 'Praia'],
                'Museu': ['Museu', 'Cultura', 'Teatro', 'Igreja', 'Monumento'],
                'Feira': ['Feira', 'Mercado', 'Artesanato'],
                'Lazer': ['Bar', 'Show', 'Balada', 'Cinema', 'Lazer', 'Entretenimento']
            };

            async function carregarLocais() {
                try {
                    const locaisRef = window.collectionFirebase(window.dbFirebase, "locais");
                    const q = window.queryFirebase(locaisRef, window.whereFirebase("status", "==", "ativo"));
                    const snap = await window.getDocsFirebase(q);
                    locaisGlobais = [];
                    snap.forEach((doc) => { locaisGlobais.push({ id: doc.id, ...doc.data() }); });

                    // Alterado: chama aplicarFiltros() para inicializar a primeira página com os cortes corretos
                    aplicarFiltros();
                } catch (erro) { console.error("Erro ao carregar locais:", erro); }
            }

            // ATUALIZADA: Limpa a tela e renderiza estritamente os 20 itens correspondentes à página atual
            function renderizarLocais(lista) {
                const div = document.getElementById('grade-conteudo');

                // Em sistemas numéricos (1, 2, 3), sempre limpamos a tela para exibir apenas o bloco atual
                div.innerHTML = lista.length === 0 ? '<div class="col-12 text-center text-muted py-5"><h4>Nenhum local encontrado nesta categoria.</h4></div>' : '';

                // Realiza o fatiamento (slice) matemático exato baseado na página numérica atual
                const inicio = (paginaAtual - 1) * limitePorPagina;
                const fim = inicio + limitePorPagina;
                const itensParaExibir = lista.slice(inicio, fim);

                itensParaExibir.forEach(item => {
                    let etiqueta = item.tipo_local === 'evento' ? `📅 ${item.data_evento}` : `📍 ${item.categoria}`;

                    // ATUALIZADO: Agora todos os usuários visualizam os mesmos botões normais do site
                    let botoesAcao = `
            <button class="btn btn-outline-success w-50 btn-sm fw-bold" onclick="window.abrirModalRoteiro('${item.id}', event)">+ Roteiro</button>
            <a href="detalhes.html?id=${item.id}" class="btn btn-primary w-50 btn-sm fw-bold">Detalhes</a>
        `;

                    div.innerHTML += `
<div class="col-md-4 mb-4">
    <div class="card card-evento h-100 shadow-sm" onclick="window.location.href='detalhes.html?id=${item.id}'">
        <img src="${item.imagem}" class="card-img-top" onerror="this.src='img/ilustrativa_${item.categoria.toLowerCase()}.jpg'">
        <div class="card-body d-flex flex-column">
            <div>
                <span class="badge-categoria mb-2 d-inline-block">${etiqueta}</span>
                <h5 class="card-title fw-bold mt-2">${item.nome}</h5>
                <p class="card-text text-secondary small">${item.descricao.substring(0, 80)}...</p>
            </div>
            <div class="mt-auto pt-3 d-flex gap-2">${botoesAcao}</div>
        </div>
    </div>
</div>`;
                });

                // Chama a função para desenhar a paginação de botões 1, 2, 3
                configurarNumerosPagina(lista.length);
            }

            // NOVA FUNÇÃO: Gera dinamicamente os botões da lista e marca o atual como ativo
            function configurarNumerosPagina(totalItens) {
                const btnContainer = document.getElementById('container-paginacao');
                const listaNumeros = document.getElementById('lista-numeros-pagina');

                // Calcula a quantidade total de páginas necessárias
                const totalPaginas = Math.ceil(totalItens / limitePorPagina);

                // Se o resultado renderizar apenas 1 página ou nenhuma, esconde a barra
                if (totalPaginas <= 1) {
                    btnContainer.style.display = "none";
                    return;
                }

                btnContainer.style.display = "flex";
                listaNumeros.innerHTML = "";

                // Monta os botões na tela adicionando a classe active no botão correspondente
                for (let i = 1; i <= totalPaginas; i++) {
                    const classeAtiva = (i === paginaAtual) ? 'active' : '';
                    listaNumeros.innerHTML += `
                <li class="page-item ${classeAtiva}">
                    <button class="page-link fw-bold" onclick="window.mudarParaPagina(${i})">${i}</button>
                </li>
            `;
                }
            }

            // NOVA FUNÇÃO: Acionada ao clicar em qualquer número da listagem
            window.mudarParaPagina = (numero) => {
                paginaAtual = numero;
                renderizarLocais(locaisFiltrados);

                // Faz a tela subir de volta suavemente para o início da lista de cards
                document.getElementById('grade-conteudo').scrollIntoView({ behavior: 'smooth' });
            };

            // ATUALIZADA: Agora armazena os dados na variável global 'locaisFiltrados' e reseta a página para 1
            function aplicarFiltros() {
                // 1. Captura os termos de busca e limpa espaços extras
                const termo = document.getElementById('input-busca').value.toLowerCase().trim();
                const localidade = document.getElementById('input-localidade').value.toLowerCase().trim();

                // Sempre que o usuário interagir com filtros, reinicia para a página 1 obrigatoriamente
                paginaAtual = 1;

                // 2. Filtra a lista global baseada nos critérios ativos e joga no array global locaisFiltrados
                locaisFiltrados = locaisGlobais.filter(item => {

                    // Filtro A: Categoria (Nicho) - Verifica se o item pertence ao grupo selecionado
                    let bateNicho = false;
                    if (filtroAtual === 'todos') {
                        bateNicho = true;
                    } else {
                        const categoriesPermitidas = mapaCategorias[filtroAtual] || [filtroAtual];
                        bateNicho = categoriesPermitidas.some(cat =>
                            item.categoria.toLowerCase() === cat.toLowerCase()
                        );
                    }

                    // Filtro B: Texto - Busca no Nome ou na Descrição (Tempo Real)
                    // Se o campo estiver vazio, retorna true para não filtrar nada por texto
                    const bateTexto = termo === "" ||
                        item.nome.toLowerCase().includes(termo) ||
                        item.descricao.toLowerCase().includes(termo);

                    // Filtro C: Localidade - Busca na Rua, Cidade ou Estado
                    let enderecoCompleto = "";
                    if (typeof item.endereco === 'object' && item.endereco !== null) {
                        enderecoCompleto = `${item.endereco.rua || ""} ${item.endereco.cidade || ""} ${item.endereco.estado || ""}`.toLowerCase();
                    } else {
                        enderecoCompleto = String(item.endereco || "").toLowerCase();
                    }
                    const bateLocal = localidade === "" || enderecoCompleto.includes(localidade);

                    // O item só aparece se passar nos três filtros simultaneamente
                    return bateNicho && bateTexto && bateLocal;
                });

                // Se um filtro geográfico (GPS ou Perfil) estiver ativo, repassa o controle com um bypass interno
                if (filtroAtivo === 'gps') {
                    window.filtrarPorGps(true);
                    return;
                } else if (filtroAtivo === 'perfil') {
                    window.filtrarPorEnderecoPerfil(true);
                    return;
                }

                // 3. Atualiza a tela com os resultados filtrados e paginados
                renderizarLocais(locaisFiltrados);
            }

            function filtrarNicho(c, b) {
                filtroAtual = c;
                document.querySelectorAll('.btn-nicho').forEach(btn => btn.classList.remove('ativo'));
                b.classList.add('ativo');
                aplicarFiltros();
            }

            // Variável para controlar qual filtro geográfico está ativo
            let filtroGeoAtivo = null;

            // Variável global para saber qual filtro está ligado
            let filtroAtivo = null;

            // --- FUNÇÃO 1: GPS (ATUALIZADA COM INTEGRAÇÃO DE PAGINAÇÃO E PARÂMETRO BYPASS) ---
            window.filtrarPorGps = (bypassToggle = false) => {
                const btn = event && event.currentTarget ? event.currentTarget : document.querySelector('[onclick*="filtrarPorGps"]');

                // Se já estiver ativo e não for uma atualização vinda da busca por texto, desliga e mostra tudo com paginação
                if (filtroAtivo === 'gps' && bypassToggle !== true) {
                    filtroAtivo = null;
                    resetarEstiloBotao(btn, 'text-primary');
                    aplicarFiltros();
                    return;
                }

                if (!navigator.geolocation) return alert("Seu navegador não suporta geolocalização.");

                navigator.geolocation.getCurrentPosition((pos) => {
                    if (bypassToggle !== true) {
                        // Limpa outros filtros antes e reinicia a página se for um clique real
                        resetarTodosBotoes();
                        paginaAtual = 1;
                    }

                    filtroAtivo = 'gps';
                    if (btn) {
                        btn.classList.replace('btn-light', 'btn-primary');
                        btn.classList.replace('text-primary', 'text-white');
                    }

                    const latUser = pos.coords.latitude;
                    const lonUser = pos.coords.longitude;

                    // Filtra geograficamente baseado na lista que já passou pela pesquisa por digitação
                    locaisFiltrados = locaisFiltrados.filter(local => {
                        const distancia = calcularDistancia(latUser, lonUser, local.lat, local.lon);
                        return distancia <= 10;
                    });

                    if (locaisFiltrados.length === 0 && bypassToggle !== true) alert("Não encontramos locais num raio de 10km.");
                    renderizarLocais(locaisFiltrados);
                });
            };

            // --- FUNÇÃO 2: PERFIL (ATUALIZADA COM INTEGRAÇÃO DE PAGINAÇÃO E PARÂMETRO BYPASS) ---
            window.filtrarPorEnderecoPerfil = (bypassToggle = false) => {
                const btn = event && event.currentTarget ? event.currentTarget : document.querySelector('[onclick*="filtrarPorEnderecoPerfil"]');

                // Se já estiver ativo e não for atualização por digitação, desliga e mostra tudo com paginação
                if (filtroAtivo === 'perfil' && bypassToggle !== true) {
                    filtroAtivo = null;
                    resetarEstiloBotao(btn, 'text-laranja');
                    aplicarFiltros();
                    return;
                }

                // Verifica se o usuário está logado
                if (!window.isLogado || !window.usuarioGlobal) return alert("Faça login primeiro!");

                // CORREÇÃO: Acessa a cidade dentro do objeto 'endereco'
                const cidadePerfil = window.usuarioGlobal.endereco ? window.usuarioGlobal.endereco.cidade : null;

                if (!cidadePerfil) return alert("Cadastre sua cidade no Perfil!");

                if (bypassToggle !== true) {
                    // Limpa outros filtros visuais e reinicia a página se for um clique real
                    resetarTodosBotoes();
                    paginaAtual = 1;
                }

                filtroAtivo = 'perfil';
                if (btn) {
                    btn.classList.replace('btn-light', 'btn-primary');
                    btn.classList.replace('text-laranja', 'text-white');
                }

                // Filtra comparando a cidade do perfil com a cidade do local extraída de locaisFiltrados
                locaisFiltrados = locaisFiltrados.filter(local => {
                    // Trata o endereço do local de forma segura, seja ele objeto ou string 
                    const cidadeLocal = (typeof local.endereco === 'object' && local.endereco !== null)
                        ? local.endereco.cidade
                        : String(local.endereco || "");

                    return cidadeLocal.toLowerCase().includes(cidadePerfil.toLowerCase());
                });

                if (locaisFiltrados.length === 0 && bypassToggle !== true) {
                    alert(`Ainda não temos locais cadastrados em ${cidadePerfil}.`);
                }

                renderizarLocais(locaisFiltrados);
            };

            // --- FUNÇÕES DE APOIO ---

            function resetarEstiloBotao(btn, classeCorOriginal) {
                if (!btn) return;
                btn.classList.remove('btn-primary', 'text-white');
                btn.classList.add('btn-light', classeCorOriginal);
            }

            function resetarTodosBotoes() {
                const btnGps = document.querySelector('[onclick*="filtrarPorGps"]');
                const btnPerfil = document.querySelector('[onclick*="filtrarPorEnderecoPerfil"]');
                if (btnGps) resetarEstiloBotao(btnGps, 'text-primary');
                if (btnPerfil) resetarEstiloBotao(btnPerfil, 'text-laranja');
            }

            // Sua função Haversine que já funciona perfeitamente
            function calcularDistancia(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            }
        </script>
        <input type="hidden" id="id-local-temp">

        <div class="modal fade" id="modalAddRoteiro" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold">Adicionar ao Roteiro</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <label class="form-label small text-muted">Selecione um dos seus roteiros:</label>
                        <select id="select-roteiros" class="form-select mb-3"></select>
                        <button class="btn btn-primary w-100 fw-bold"
                            onclick="window.confirmarAdicaoRoteiro()">Confirmar
                            Adição</button>
                    </div>
                </div>
            </div>
        </div>
</body>
