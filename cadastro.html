<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Mundoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f67123; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card-cadastro { background: white; padding: 40px; border-radius: 15px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .btn-azul { background: #00008b; color: white; width: 100%; font-weight: bold; padding: 10px; border: none; border-radius: 5px; }
        .btn-azul:hover { background: #00005c; }
        .form-check-input:checked { background-color: #f67123; border-color: #f67123; }
    </style>
</head>
<body>
    <div class="card-cadastro">
        <h2 class="mb-4 text-center fw-bold" style="color: #f67123;">CADASTRO</h2>
        
        <form id="form-cadastro">
            
            <div class="mb-3">
                <label class="form-label fw-bold">Usuário (Nome)</label>
                <input type="text" name="nome" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">E-mail</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Senha</label>
                <input type="password" name="senha" id="senha" class="form-control" placeholder="Crie uma senha" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Confirmar Senha</label>
                <input type="password" id="confirma_senha" class="form-control" placeholder="Repita a senha" required>
                <div id="erro-senha" class="form-text text-danger d-none">As senhas não conferem!</div>
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="check-mostrar">
                <label class="form-check-label small" for="check-mostrar">Exibir senhas</label>
            </div>
            
            <button type="submit" class="btn btn-azul mb-3">CADASTRAR-SE</button>
        </form>
        
        <div class="text-center">
            <a href="login.html" class="small text-muted text-decoration-none">Já tenho conta? <b>Faça Login</b></a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDGDvRBfJlztDRpQS1MHkYlDQst7ZtfHCo",
            authDomain: "mundoria-53de5.firebaseapp.com",
            projectId: "mundoria-53de5",
            storageBucket: "mundoria-53de5.firebasestorage.app",
            messagingSenderId: "86901345396",
            appId: "1:86901345396:web:969fa3637292d0333e1521"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('check-mostrar').addEventListener('change', function() {
            const type = this.checked ? "text" : "password";
            document.getElementById('senha').type = type;
            document.getElementById('confirma_senha').type = type;
        });

        const form = document.getElementById('form-cadastro');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nome = form.nome.value;
            const email = form.email.value;
            const senha = document.getElementById('senha').value;
            const confirma = document.getElementById('confirma_senha').value;

            if (senha !== confirma) {
                document.getElementById('erro-senha').classList.remove('d-none');
                return;
            }

            try {
                // 1. Cria o usuário no Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
                
                // 2. Salva no Firestore usando o EMAIL como ID do documento
                // MUDANÇA AQUI: doc(db, "users", email) em vez de user.uid
                await setDoc(doc(db, "users", email), {
                    nome: nome,
                    email: email,
                    tipo: "turista",
                    foto: "https://cdn-icons-png.flaticon.com/512/847/847969.png"
                });

                alert("Conta criada com sucesso!");
                window.location.href = "login.html";
            } catch (error) {
                console.error("Erro detalhado:", error);
                alert("Erro ao cadastrar: " + error.message);
            }
        });
    </script>
</body>
</html>
